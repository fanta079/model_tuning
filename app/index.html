<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E.V.</title>
<style>
  :root{
    --bg:#14161a; --card:#1c1f24; --line:#2b3038; --text:#e8e6e1;
    --dim:#8b9099; --accent:#7fb3d5; --accent-dim:#3d5a70;
    --err:#e08080; --ok:#7bc4a0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  header{
    padding:12px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;flex:none;
  }
  header h1{font-size:15px;font-weight:500;margin:0;letter-spacing:3px}
  #health{font-size:12px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.5}
  #health .bad{color:var(--err)}
  #health .good{color:var(--ok)}

  /* ---------- 舞台：球体 + 声频 ---------- */
  #stage{
    flex:1;min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;padding:6px 18px 0;
  }
  #orb{
    width:min(320px,42vh);aspect-ratio:1;cursor:pointer;
    display:block;touch-action:manipulation;
  }
  #recTimer{
    height:20px;font-size:12px;letter-spacing:1px;color:var(--err);
    opacity:0;transition:opacity .2s;
  }
  #recTimer.on{opacity:1}
  #meter{
    width:min(280px,62%);height:3px;border-radius:2px;overflow:hidden;
    background:#22262d;opacity:0;transition:opacity .2s;
  }
  #meter.on{opacity:1}
  #meterFill{height:100%;width:0;background:var(--err);transition:width .06s linear}
  #devInfo{height:16px;font-size:11px;color:#5c6169;opacity:0;transition:opacity .2s}
  #devInfo.on{opacity:1}
  #wave{width:100%;max-width:560px;height:54px;display:block}

  /* ---------- 对话记录 ---------- */
  #log{
    flex:0 0 26vh;overflow-y:auto;padding:12px 18px;
    border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  }
  .row{display:flex;flex-direction:column;gap:2px;max-width:84%}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.ev{align-self:flex-start}
  .who{font-size:11px;color:var(--dim);letter-spacing:1px}
  .bub{padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
  .row.me .bub{background:#2b3038;border-bottom-right-radius:3px}
  .row.ev .bub{background:var(--accent-dim);color:#eaf3f9;border-bottom-left-radius:3px}
  .row.sys{align-self:center;max-width:100%}
  .row.sys .bub{background:none;color:var(--dim);font-size:12px;padding:2px 0;text-align:center}

  /* ---------- 底部控制 ---------- */
  footer{
    flex:none;padding:10px 18px 14px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  #hint{font-size:13px;color:var(--dim);min-height:20px;text-align:center}
  .controls{display:flex;align-items:center;gap:8px;width:100%;max-width:560px}
  #mic{
    flex:none;min-width:84px;height:38px;padding:0 16px;border-radius:19px;
    border:1px solid transparent;cursor:pointer;background:var(--accent-dim);
    color:#eaf3f9;font-size:13px;font-family:inherit;transition:.15s;
  }
  #mic:hover:not(:disabled){background:#4a6b84}
  #mic:disabled{cursor:not-allowed;opacity:.45}
  #mic.rec{background:#8c4a4a;border-color:#e08080;animation:pulse 1.1s infinite}
  #mic.think{background:#4a4a6b}
  #mic.speak{background:#3f6b5c}
  #phone{
    flex:none;height:38px;padding:0 14px;border-radius:19px;
    border:1px solid var(--line);cursor:pointer;background:#20242b;
    color:var(--dim);font-size:13px;font-family:inherit;transition:.15s;
  }
  #phone:hover{border-color:var(--accent-dim);color:var(--text)}
  #phone.on{background:#3f6b5c;border-color:#7bc4a0;color:#eaf3f9}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,128,128,.45)}50%{box-shadow:0 0 0 12px rgba(224,128,128,0)}}
  #typeIn{
    flex:1;min-width:0;height:38px;padding:0 12px;border-radius:10px;
    border:1px solid var(--line);background:#20242b;color:var(--text);
    font-size:14px;font-family:inherit;outline:none;
  }
  #typeIn:focus{border-color:var(--accent-dim)}
  #reset{
    flex:none;height:38px;padding:0 12px;background:none;border:none;
    color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;
  }
  #reset:hover{color:var(--text)}
  .devRow{display:none;width:100%;max-width:560px;justify-content:flex-end;margin-top:-2px}
  .devRow.on{display:flex}
  #dev{
    background:#20242b;color:var(--dim);border:1px solid var(--line);
    border-radius:8px;font-size:12px;padding:4px 6px;max-width:280px;
    font-family:inherit;outline:none;
  }
  #devRefresh{
    background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--dim);font-size:12px;padding:4px 8px;cursor:pointer;
    font-family:inherit;margin-left:6px;
  }
  #devRefresh:hover{border-color:var(--accent-dim);color:var(--text)}
  .t{font-size:11px;color:#5c6169;cursor:pointer;user-select:none}
  #diag{
    display:none;width:100%;max-width:560px;margin-top:2px;
    font:11px/1.5 ui-monospace,Consolas,monospace;color:#8b9099;
    background:#1a1d22;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;white-space:pre-wrap;word-break:break-all;
  }
  #diag.on{display:block}
</style>
</head>
<body>

<header>
  <h1>E.V.</h1>
  <div id="health">检查组件…</div>
</header>

<div id="stage">
  <canvas id="orb"></canvas>
  <div id="recTimer"></div>
  <div id="meter"><div id="meterFill"></div></div>
  <div id="devInfo"></div>
  <canvas id="wave"></canvas>
</div>

<div id="log"></div>

<footer>
  <div id="hint">点中间的球，或者下面的按钮开始说话</div>
  <div class="controls">
    <button id="mic" disabled>准备中</button>
    <button id="phone" title="电话模式：不用按键，停顿自动接话">电话</button>
    <input id="typeIn" placeholder="也可以打字，回车发送" autocomplete="off">
    <button id="reset">清空</button>
  </div>
  <div class="devRow">
    <select id="dev" title="选择输入设备"></select>
    <button id="devRefresh" title="授权并刷新设备名">刷新</button>
  </div>
  <div class="t" id="buildStamp" title="点一下看诊断信息">页面构建 __BUILD__</div>
  <pre id="diag"></pre>
</footer>

<script>
'use strict';

// ==================== 元素 ====================
const mic = document.getElementById('mic');
const phoneBtn = document.getElementById('phone');
const hint = document.getElementById('hint');
const logEl = document.getElementById('log');
const health = document.getElementById('health');
const typeIn = document.getElementById('typeIn');
const recTimer = document.getElementById('recTimer');
const orb = document.getElementById('orb');
const wave = document.getElementById('wave');
const meterEl = document.getElementById('meter');
const meterFill = document.getElementById('meterFill');
const devInfo = document.getElementById('devInfo');
const devSel = document.getElementById('dev');
const devRow = document.querySelector('.devRow');
const devRefresh = document.getElementById('devRefresh');
const diagEl = document.getElementById('diag');
const buildStamp = document.getElementById('buildStamp');

const octx = orb.getContext('2d');
const wctx = wave.getContext('2d');

// ==================== 状态 ====================
let state = 'idle';          // idle | recording | thinking | speaking
let recorder = null;
let chunks = [];
let recStart = 0;
let recTick = null;
let ripples = [];
let devLabel = '未知设备';
let silentSince = 0;
let silenceWarned = false;
let inputDeviceId = '';
let micTrack = null;
let diagAt = 0;

// ---- 电话模式（连续对话）----
let phoneOn = false;
let phoneStream = null;
let phoneRec = null;
let phoneChunks = [];
let phoneTurnAt = 0;
let hasSpeech = false;
let speechFrom = 0;
let silenceFrom = 0;
let bargeFrom = 0;
let micAnalyser = null;
let playAnalyser = null;
let curAudio = null;

const hasMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function micWhy() {
  if (location.protocol === 'file:') return '页面用文件方式打开了（file://）';
  if (!window.isSecureContext) return location.host + ' 不是安全上下文（非 localhost 的 http 会被浏览器禁用麦克风）';
  if (!navigator.mediaDevices) return '浏览器不支持 MediaDevices（请用 Chrome / Edge）';
  return '';
}

// ==================== 音频分析 ====================
let audioCtx = null, analyser = null, freqBuf = null, timeBuf = null, micSrc = null;

function ensureCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function makeAnalyser() {
  const ctx = ensureCtx();
  if (!ctx) return null;
  const an = ctx.createAnalyser();
  an.fftSize = 1024;
  an.smoothingTimeConstant = 0.75;
  if (freqBuf === null || freqBuf.length !== an.frequencyBinCount) {
    freqBuf = new Uint8Array(an.frequencyBinCount);
  }
  if (timeBuf === null || timeBuf.length !== an.fftSize) {
    timeBuf = new Uint8Array(an.fftSize);
  }
  return an;
}

// 麦克风接分析器（不接 destination，避免自己听自己）
let audioGraphErr = '';
function attachMic(stream) {
  const ctx = ensureCtx();
  const an = makeAnalyser();
  if (!ctx || !an) { audioGraphErr = '浏览器不支持 AudioContext'; return false; }
  try {
    micSrc = ctx.createMediaStreamSource(stream);
    micSrc.connect(an);
    analyser = an;
    micAnalyser = an;
    audioGraphErr = '';
    return true;
  } catch (e) {
    analyser = null;
    micAnalyser = null;
    audioGraphErr = e.message || String(e);
    return false;
  }
}

// 播放音频接分析器（同时要连到扬声器）
let playSrc = null;
function attachPlayback(audioEl) {
  const ctx = ensureCtx();
  const an = makeAnalyser();
  if (!ctx || !an) return null;
  try {
    playSrc = ctx.createMediaElementSource(audioEl);
    playSrc.connect(an);
    an.connect(ctx.destination);
    analyser = an;
    playAnalyser = an;
    return playSrc;
  } catch (e) { analyser = micAnalyser; playAnalyser = null; return null; }
}

// 只拆麦克风侧（电话模式会一直持有它）
function detachMic() {
  try { if (micSrc) micSrc.disconnect(); } catch (e) {}
  micSrc = null;
  micAnalyser = null;
  micTrack = null;
  if (analyser !== playAnalyser) analyser = playAnalyser;
}

// 只拆播放侧（说完一轮就拆，麦克风继续留着）
function detachPlay() {
  try { if (playSrc) playSrc.disconnect(); } catch (e) {}
  playSrc = null;
  playAnalyser = null;
  analyser = micAnalyser;
  curAudio = null;
}

// 兼容老调用：整条拆掉
function detach() { detachPlay(); detachMic(); }

// 给某个 analyser 算音量
function analyserLevel(an) {
  if (!an) return 0;
  if (!timeBuf || timeBuf.length !== an.fftSize) timeBuf = new Uint8Array(an.fftSize);
  an.getByteTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) {
    const v = (timeBuf[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / timeBuf.length) * 4.5);
}

// 音量（0~1）：时域 RMS，放大后裁剪
function level() {
  if (!analyser || !timeBuf) return 0;
  analyser.getByteTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) {
    const v = (timeBuf[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / timeBuf.length) * 4.5);
}

function spectrum() {
  if (!analyser || !freqBuf) return null;
  analyser.getByteFrequencyData(freqBuf);
  return freqBuf;
}

// ==================== 颜色 ====================
const PAL = {
  idle:      { h: 205, s: 32, l: 56 },
  recording: { h: 4,   s: 58, l: 60 },
  thinking:  { h: 244, s: 42, l: 62 },
  speaking:  { h: 165, s: 38, l: 54 },
};
function hsla(h, s, l, a) {
  return 'hsla(' + h + ',' + Math.max(0, Math.min(100, s)) + '%,'
         + Math.max(0, Math.min(100, l)) + '%,' + a + ')';
}

// ==================== 画布尺寸 ====================
function fitCanvas(cv, ctx) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return { w: 0, h: 0 };
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: w, h: h };
}

// ==================== 画球 ====================
function drawOrb(now, amp) {
  const { w, h } = fitCanvas(orb, octx);
  if (!w || !h) return;
  const cx = w / 2, cy = h / 2;
  const col = PAL[state] || PAL.idle;

  octx.clearRect(0, 0, w, h);

  // 呼吸 + 音量驱动
  const base = Math.min(w, h) * 0.29;
  const breathe = 0.018 * Math.sin(now * 1.15);
  const kick = state === 'idle' ? 0 : amp * 0.14;
  const R = base * (1 + breathe + kick);

  // 外圈参考环
  for (let k = 0; k < 3; k++) {
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s, col.l, 0.16 - k * 0.045);
    octx.lineWidth = 1;
    octx.arc(cx, cy, R * (1.20 + k * 0.16), 0, Math.PI * 2);
    octx.stroke();
  }

  // 旋转弧（thinking 时多两段，像在扫描）
  const arcs = state === 'thinking' ? 3 : 1;
  for (let k = 0; k < arcs; k++) {
    const a0 = now * (0.7 + k * 0.4) + k * 2.1;
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s + 8, col.l + 12, 0.5);
    octx.lineWidth = 2;
    octx.arc(cx, cy, R * 1.04, a0, a0 + 0.85);
    octx.stroke();
  }

  // 粒子环
  const N = 72;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + now * 0.26;
    const wob = Math.sin(i * 0.7 + now * 2.1) * 0.018
              + amp * 0.07 * Math.sin(i * 1.7 + now * 7);
    const rr = R * (1.0 + wob);
    const x = cx + Math.cos(a) * rr;
    const y = cy + Math.sin(a) * rr;
    const sz = 1.0 + amp * 1.9 * (0.5 + 0.5 * Math.sin(i * 0.9 + now * 5.5));
    octx.beginPath();
    octx.fillStyle = hsla(col.h, col.s, col.l + 20, 0.45 + amp * 0.45);
    octx.arc(x, y, sz, 0, Math.PI * 2);
    octx.fill();
  }

  // 波纹（录音/说话时从球体向外扩散）
  if ((state === 'recording' && amp > 0.22) || (state === 'speaking' && Math.random() < 0.25)) {
    ripples.push({ r: R * 1.06, a: state === 'recording' ? 0.3 : 0.22 });
  }
  ripples = ripples.filter(rp => rp.a > 0.015);
  for (const rp of ripples) {
    rp.r += 1.6;
    rp.a *= 0.965;
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s, col.l + 6, rp.a);
    octx.lineWidth = 1;
    octx.arc(cx, cy, rp.r, 0, Math.PI * 2);
    octx.stroke();
  }

  // 核心球
  const g = octx.createRadialGradient(cx - R * 0.22, cy - R * 0.26, R * 0.08, cx, cy, R);
  g.addColorStop(0, hsla(col.h, col.s - 12, 84, 0.9));
  g.addColorStop(0.45, hsla(col.h, col.s, col.l + 6, 0.62));
  g.addColorStop(0.85, hsla(col.h, col.s, col.l - 6, 0.28));
  g.addColorStop(1, hsla(col.h, col.s, col.l - 20, 0.03));
  octx.beginPath();
  octx.fillStyle = g;
  octx.arc(cx, cy, R, 0, Math.PI * 2);
  octx.fill();
}

// ==================== 画声频 ====================
const BARS = 52;
const barLevels = new Float32Array(BARS);

function drawWave(now) {
  const { w, h } = fitCanvas(wave, wctx);
  if (!w || !h) return;
  const col = PAL[state] || PAL.idle;
  const data = spectrum();

  wctx.clearRect(0, 0, w, h);

  const slot = w / BARS;
  const bw = Math.max(2, slot * 0.55);

  for (let i = 0; i < BARS; i++) {
    let target;
    if (data) {
      // 对数取样：低频给更多格子，人声集中在这里
      const pos = Math.pow(i / BARS, 1.5);
      const bin = Math.min(data.length - 1, Math.floor(pos * data.length * 0.62));
      target = (data[bin] / 255) * (1 - pos * 0.35);
      if (state === 'idle') target = 0;
    } else {
      target = 0;
    }
    // idle 时给一点极轻的呼吸，表示"在线"
    const idleBreath = 0.05 + 0.035 * Math.sin(now * 1.3 + i * 0.35);
    if (state === 'idle') target = idleBreath;

    barLevels[i] += (target - barLevels[i]) * 0.35;

    const bh = Math.max(2, barLevels[i] * (h - 6));
    const x = i * slot + (slot - bw) / 2;
    const y = h - bh - 2;
    wctx.fillStyle = hsla(col.h, col.s + 6, col.l + 8, 0.28 + barLevels[i] * 0.7);
    if (wctx.roundRect) {
      wctx.beginPath();
      wctx.roundRect(x, y, bw, bh, bw / 2);
      wctx.fill();
    } else {
      wctx.fillRect(x, y, bw, bh);
    }
  }

  // 中线
  wctx.strokeStyle = hsla(col.h, col.s, col.l, 0.12);
  wctx.lineWidth = 1;
  wctx.beginPath();
  wctx.moveTo(0, h - 1.5);
  wctx.lineTo(w, h - 1.5);
  wctx.stroke();
}

// ==================== 主循环 ====================
function drawDiag(now) {
  if (!diagEl.classList.contains('on') || now - diagAt < 0.4) return;
  diagAt = now;
  const t = micTrack;
  let s = {};
  try { if (t && t.getSettings) s = t.getSettings() || {}; } catch (e) {}
  const lines = [
    'ctx       : ' + (audioCtx ? audioCtx.state : '未创建')
      + '   analyser: ' + (analyser ? 'yes' : 'no'),
    'track     : ' + (t ? (t.label || '(无标签)') : '(当前未录音)'),
    'track 状态: readyState=' + (t ? t.readyState : '-')
      + '  muted=' + (t ? t.muted : '-')
      + '  enabled=' + (t ? t.enabled : '-'),
    '采样       : ' + (s.sampleRate || '-') + ' Hz  '
      + (s.channelCount || '-') + ' ch',
    '信号       : rms=' + level().toFixed(4)
      + '  (' + (analyser ? '已接分析器' : '未接 —— 波形不可能动') + ')',
    '状态       : ' + state,
    '可用输入   : ' + devSel.options.length + ' 个',
  ];
  diagEl.textContent = lines.join('\n');
}

function loop() {
  const now = performance.now() / 1000;
  const amp = state === 'idle' ? 0 : level();

  // 录音时：电平条 + 静默告警（"说了话但采不到"最容易误判）
  if (state === 'recording') {
    meterFill.style.width = Math.min(100, amp * 150) + '%';
    if (amp > 0.02) {
      silentSince = 0;
      if (silenceWarned) silenceWarned = false;
    } else if (!silentSince) {
      silentSince = now;
    } else if (!silenceWarned && now - silentSince > 2.5) {
      silenceWarned = true;
      const susp = audioCtx && audioCtx.state !== 'running';
      setHint(susp
        ? '⚠️ 音频上下文被浏览器挂起（' + audioCtx.state + '）—— 点一下页面任意处再试'
        : '⚠️ 没收到声音（电平 0）—— 检查麦克风静音键，或换一个输入设备（当前：' + devLabel + '）');
    }
  }

  // ---- 电话模式：自动断句 + 打断 ----
  if (phoneOn) {
    if (state === 'recording') {
      const a = analyserLevel(micAnalyser);
      if (a > VAD_SPEECH) {
        if (!speechFrom) speechFrom = now;
        hasSpeech = true;
        silenceFrom = 0;
      } else if (hasSpeech) {
        if (!silenceFrom) silenceFrom = now;
        else if (now - silenceFrom > VAD_SILENCE) {
          // 只说了"咳"一声这种极短的，判为噪声，继续听，不发送
          if (now - speechFrom >= MIN_SPEECH) endPhoneTurn();
          else { hasSpeech = false; speechFrom = 0; silenceFrom = 0; }
        }
      }
      if (hasSpeech && now - phoneTurnAt > VAD_MAX_TURN) endPhoneTurn();
      // 一直没人说话：定期重开一段，避免录出一个巨大的空文件
      if (!hasSpeech && now - phoneTurnAt > 40) endPhoneTurn();
    } else if (state === 'speaking') {
      // 她说话时：你开口就可以打断（单向，只允许你打断她）
      const m = analyserLevel(micAnalyser);
      if (m > BARGE_LEVEL) {
        if (!bargeFrom) bargeFrom = now;
        else if (now - bargeFrom > BARGE_HOLD) { interruptHer(); }
      } else {
        bargeFrom = 0;
      }
    }
  }

  drawOrb(now, amp);
  drawWave(now);
  drawDiag(now);
  requestAnimationFrame(loop);
}

// ==================== 界面状态 ====================
const LABEL = { idle: '说话', recording: '发送', thinking: '思考', speaking: '说话中' };

function setState(s) {
  state = s;
  mic.className = (s === 'recording') ? 'rec'
                : (s === 'thinking') ? 'think'
                : (s === 'speaking') ? 'speak' : '';
  mic.textContent = phoneOn ? '通话中' : LABEL[s];
  // 半双工：thinking / speaking 时不许开新一轮。
  // ⚠️ recording 必须可点 —— 那一下就是「发送」，锁住就永远发不出去。
  // 电话模式下这个按钮不参与流程（用「挂断」退出）。
  mic.disabled = phoneOn || (s === 'thinking' || s === 'speaking') || !hasMic;
  orb.style.cursor = mic.disabled ? 'default' : 'pointer';

  if (s === 'recording') {
    recStart = Date.now();
    silentSince = 0;
    silenceWarned = false;
    clearInterval(recTick);
    recTick = setInterval(() => {
      const t = Math.floor((Date.now() - recStart) / 1000);
      const pct = Math.round(Math.min(1, level()) * 100);
      recTimer.textContent = '● 录音 ' + String(Math.floor(t / 60)) + ':' + String(t % 60).padStart(2, '0')
                           + (analyser ? '　电平 ' + pct + '%' : '　(无波形)');
    }, 200);
    recTimer.classList.add('on');
    meterEl.classList.add('on');
    devInfo.classList.add('on');
  } else {
    clearInterval(recTick);
    recTimer.classList.remove('on');
    recTimer.textContent = '';
    meterEl.classList.remove('on');
    meterFill.style.width = '0%';
    if (s !== 'idle') { /* 保留设备名，方便排查 */ } else { devInfo.classList.remove('on'); }
  }
}

function addRow(who, text, cls) {
  const row = document.createElement('div');
  row.className = 'row ' + cls;
  if (who) {
    const w = document.createElement('div');
    w.className = 'who'; w.textContent = who;
    row.appendChild(w);
  }
  const b = document.createElement('div');
  b.className = 'bub'; b.textContent = text;
  row.appendChild(b);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}
function setHint(t) { hint.textContent = t; }

// ==================== 健康检查 ====================
async function checkHealth() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const line = (label, o) =>
      '<span class="' + (o.ok ? 'good' : 'bad') + '">' + label + ' ' + (o.ok ? 'OK' : '×') + '</span>';
    health.innerHTML = [line('STT', d.stt), line('LLM', d.llm), line('TTS', d.tts)].join('　')
      + '<br><span style="font-size:11px">' + d.llm.base + '</span>';

    const allOk = d.stt.ok && d.llm.ok;
    if (allOk) {
      if (state === 'idle') {
        setState('idle');
        setHint(hasMic ? '点中间的球开始说话，说完再点一下发送'
                       : '麦克风不可用（' + micWhy() + '）—— 打字也能聊');
      }
    } else if (d.stt.loading) {
      mic.disabled = true; mic.textContent = '加载中';
      if (state === 'idle') setHint('语音识别模型正在载入（首次约 10~20 秒）…… 也可以先打字');
    } else {
      mic.disabled = true; mic.textContent = '不可用';
      if (state === 'idle') {
        setHint('组件没就绪：'
          + (!d.stt.ok ? '语音识别未加载（' + (d.stt.msg || '') + '）' : '')
          + (!d.llm.ok ? '模型服务连不上' : '') + ' —— 打字仍然可用');
      }
    }
  } catch (e) {
    health.innerHTML = '<span class="bad">后端连不上</span>';
    mic.disabled = true; mic.textContent = '离线';
    setHint('后端没起来？确认 run_app.sh 正在运行');
  }
}

// ==================== 输入设备 ====================
const MIC_KEY = 'ev.micId';           // 记住上次选的麦克风，下次打开不用再挑

async function fillDevices() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  try {
    const list = await navigator.mediaDevices.enumerateDevices();
    const ins = list.filter(d => d.kind === 'audioinput');
    if (!ins.length) return;
    const cur = inputDeviceId || devSel.value;
    devSel.innerHTML = '';
    ins.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      // 没授权时 label 是空的，只能靠序号区分；点「刷新」授权后就显示真名
      o.textContent = (i + 1) + '. ' + (d.label || '麦克风（未授权，点「刷新」显示名称）');
      devSel.appendChild(o);
    });
    if (cur && ins.some(d => d.deviceId === cur)) devSel.value = cur;
    else if (!cur) inputDeviceId = devSel.value;
    // 注意：未授权时 Chrome 会隐藏 deviceId，这时 cur 匹配不上 ——
    // 但**不要清掉记忆的 ID**，否则每次打开都要重选
    devRow.classList.add('on');
  } catch (e) { /* 没权限时拿不到 label，忽略 */ }
}

function rememberDevice() {
  inputDeviceId = devSel.value;
  try { localStorage.setItem(MIC_KEY, inputDeviceId); } catch (e) {}
}

devSel.onchange = () => {
  rememberDevice();
  const name = devSel.options[devSel.selectedIndex].textContent;
  setHint('已切换到「' + name + '」—— 下次录音生效（已记住）');
};

// 授权一次，把设备真实名称刷出来（Chrome 只有授权后才给 label）
devRefresh.onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch (e) { setHint('授权失败：' + e.message); return; }
  await fillDevices();
  const sel = devSel.options[devSel.selectedIndex];
  setHint('设备列表已更新，当前：' + (sel ? sel.textContent : ''));
};

// 统一的麦克风约束 + 打开逻辑（记住的设备失效时自动退回默认）
function micConstraints() {
  return Object.assign(
    { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    inputDeviceId ? { deviceId: { exact: inputDeviceId } } : {}
  );
}
async function openMic() {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
  } catch (e) {
    if (e.name === 'OverconstrainedError' && inputDeviceId) {
      inputDeviceId = '';
      try { localStorage.removeItem(MIC_KEY); } catch (err) {}
      return await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
    }
    throw e;
  }
}
// 把"实际用到的设备"记下来，下次自动用同一个
function adoptDevice(track) {
  const s = (track && track.getSettings) ? track.getSettings() : {};
  if (!s.deviceId) return;
  inputDeviceId = s.deviceId;
  try { localStorage.setItem(MIC_KEY, s.deviceId); } catch (e) {}
  devSel.value = s.deviceId;
}

// ==================== 录音 ====================
async function startRec() {
  if (!hasMic) { setHint('麦克风不可用：' + micWhy()); return; }

  // ⚠️ 必须在"用户点按钮"这个手势里同步创建 AudioContext。
  // 如果等 getUserMedia 的 await 之后再建，浏览器认为手势已过期，
  // ctx 会停在 suspended，AnalyserNode 读出来全是 0 —— 表现就是"录音中但毫无反应"。
  const ctx = ensureCtx();
  if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }

  try {
    const stream = await openMic();
    const graphOk = attachMic(stream);
    const track = stream.getAudioTracks()[0];
    micTrack = track;
    adoptDevice(track);
    devLabel = track ? (track.label || '未知设备') : '无音频轨';
    devInfo.textContent = '输入设备：' + devLabel;
    fillDevices();

    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : '';
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      detachMic();
      sendAudio(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
    };
    recorder.start();
    setState('recording');
    setHint(graphOk
      ? '正在录音…… 说完点「发送」（球和声频在动就说明收到了）'
      : '正在录音，但音频分析不可用（' + audioGraphErr + '）—— 先发出去看识别结果');
  } catch (e) {
    setState('idle');
    setHint('拿不到麦克风：' + e.message + '　（'
      + (micWhy() || '检查系统麦克风权限：Windows 设置 → 隐私 → 麦克风') + '）');
  }
}
function stopRec() {
  if (recorder && recorder.state === 'recording') recorder.stop();
}

// ==================== 电话模式（连续对话） ====================
// 原理：麦克风一直开着 -> 录音分段 -> 检测到"说过话 + 停顿 0.75s"就自动发送
//      -> 她说完自动重新开始收音；说话期间检测到你的声音就打断她（barge-in）

const VAD_SPEECH = 0.055;     // 判定"在说话"的音量阈值
const VAD_SILENCE = 1.4;      // 停顿多久才认为你说完（宁长勿短：不允许她打断你）
const MIN_SPEECH = 0.35;      // 至少说这么久才算一句（挡掉咳嗽/碰麦/鼠标声）
const VAD_MAX_TURN = 20;      // 单轮最长(秒)，防止一直录
const BARGE_LEVEL = 0.12;     // 打断阈值（她说话时你开口）
const BARGE_HOLD = 0.25;      // 持续多久算真的打断（越小越灵敏）
const POST_PLAY_GUARD = 260;  // 她说完到重新收音之间的间隔(ms)，防尾音被当成你说的话

async function startPhone() {
  if (!hasMic) { setHint('麦克风不可用：' + micWhy()); return; }
  ensureCtx();
  try {
    phoneStream = await openMic();
  } catch (e) {
    setHint('打不开麦克风：' + e.message);
    return;
  }
  attachMic(phoneStream);
  const track = phoneStream.getAudioTracks()[0];
  micTrack = track;
  adoptDevice(track);
  devLabel = track ? (track.label || '未知设备') : '无音频轨';
  devInfo.textContent = '输入设备：' + devLabel;
  devInfo.classList.add('on');
  fillDevices();

  phoneOn = true;
  phoneBtn.classList.add('on');
  phoneBtn.textContent = '挂断';
  mic.disabled = true;
  beginPhoneTurn();
}

function beginPhoneTurn() {
  if (!phoneOn || !phoneStream) return;
  hasSpeech = false;
  speechFrom = 0;
  silenceFrom = 0;
  bargeFrom = 0;
  phoneChunks = [];

  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : '';
  try {
    phoneRec = new MediaRecorder(phoneStream, mime ? { mimeType: mime } : undefined);
  } catch (e) {
    setHint('录音器启动失败：' + e.message);
    return;
  }
  phoneRec.ondataavailable = e => { if (e.data.size) phoneChunks.push(e.data); };
  phoneRec.onstop = () => {
    const blob = new Blob(phoneChunks, { type: phoneRec.mimeType || 'audio/webm' });
    if (!phoneOn) { setState('idle'); return; }
    if (blob.size < 3000) { beginPhoneTurn(); return; }   // 太短，当噪声，重来
    sendAudio(blob);
  };
  phoneRec.start();
  phoneTurnAt = performance.now() / 1000;
  setState('recording');
  setHint('在听…… 慢慢说（她不会抢话）；她说话时你可随时插话');
}

function endPhoneTurn() {
  if (phoneRec && phoneRec.state === 'recording') phoneRec.stop();
}

// 重新开始收音（带一点延迟，避免她播放的尾音/回声被当成你说的话）
function resumeListening(delay) {
  if (!phoneOn) return;
  setTimeout(() => { if (phoneOn) beginPhoneTurn(); },
             delay == null ? POST_PLAY_GUARD : delay);
}

// 打断她：停止播放，立刻回到收音
function interruptHer() {
  if (curAudio) { try { curAudio.pause(); } catch (e) {} }
  detachPlay();
  bargeFrom = 0;
  beginPhoneTurn();
}

function stopPhone() {
  phoneOn = false;
  phoneBtn.classList.remove('on');
  phoneBtn.textContent = '电话';
  if (curAudio) { try { curAudio.pause(); } catch (e) {} }
  try { if (phoneRec && phoneRec.state === 'recording') phoneRec.stop(); } catch (e) {}
  if (phoneStream) {
    phoneStream.getTracks().forEach(t => t.stop());
    phoneStream = null;
  }
  detach();
  setState('idle');
  setHint('已挂断');
}

phoneBtn.onclick = () => { phoneOn ? stopPhone() : startPhone(); };

// ==================== 一轮对话 ====================
async function handleResult(d) {
  if (!d.ok) {
    setState('idle');
    setHint(d.error || '出错了');
    if (d.user_text) addRow('你', d.user_text, 'me');
    resumeListening(600);
    return;
  }
  addRow('你', d.user_text, 'me');
  addRow('E.V.', d.reply_text, 'ev');

  if (!d.audio_b64) {
    setState('idle');
    setHint('语音合成失败（' + (d.tts_error || '未知') + '），这条只回了文字');
    resumeListening(600);
    return;
  }

  const bytes = Uint8Array.from(atob(d.audio_b64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
  const a = new Audio(url);
  curAudio = a;
  const src = attachPlayback(a);

  a.onended = () => {
    try { if (src) src.disconnect(); } catch (e) {}
    detachPlay();
    URL.revokeObjectURL(url);
    const t = d.timing || {};
    if (phoneOn) { resumeListening(); return; }       // 电话模式：接着听下一句
    setState('idle');
    setHint('可以继续说了　（听 ' + (t.stt != null ? t.stt : 0) + 's / 想 '
            + (t.llm != null ? t.llm : 0) + 's）');
  };
  a.onerror = () => {
    detachPlay();
    if (phoneOn) { resumeListening(); return; }
    setState('idle');
    setHint('音频播放失败');
  };

  setState('speaking');
  setHint('她在说话……');
  try { await a.play(); }
  catch (e) {
    detachPlay();
    if (phoneOn) { setHint('浏览器拦了自动播放 —— 先手动点一下页面'); resumeListening(300); return; }
    setState('idle');
    setHint('浏览器拦了自动播放，点一下页面再试');
  }
}

async function post(url, body, thinkingHint) {
  setState('thinking');
  setHint(thinkingHint || '思考中……');
  try {
    const r = await fetch(url, { method: 'POST', body: body });
    await handleResult(await r.json());
  } catch (e) {
    setState('idle');
    setHint('请求失败：' + e.message);
    resumeListening(800);
  }
}

function sendAudio(blob) {
  const fd = new FormData();
  fd.append('audio', blob, 'voice.webm');
  post('/api/turn', fd, '识别中……');
}

function sendText(text) {
  text = (text || '').trim();
  if (!text || state !== 'idle') return;
  if (phoneOn) { setHint('电话模式下直接说话就行（想打字先点「挂断」）'); return; }
  post('/api/text', new Blob([JSON.stringify({ text: text })], { type: 'application/json' }), '思考中……');
}

// ==================== 事件 ====================
function onTap() {
  if (phoneOn) return;
  if (state === 'idle') startRec();
  else if (state === 'recording') stopRec();
}
mic.onclick = onTap;
orb.onclick = onTap;

document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', { method: 'POST' });
  logEl.innerHTML = '';
  addRow('', '已清空上下文', 'sys');
};

typeIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { sendText(typeIn.value); typeIn.value = ''; }
});

// 任何一次点击都尝试唤醒被挂起的 AudioContext（浏览器自动播放策略）
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, true);

buildStamp.onclick = () => diagEl.classList.toggle('on');

if (!hasMic) {
  mic.textContent = '无麦克风';
  mic.disabled = true;
  addRow('', '麦克风不可用：' + micWhy() + '　已切换为键盘输入模式（回复照常朗读）。', 'sys');
}

addRow('', '点中间的球开始说话。她话不多，别指望长篇大论。', 'sys');
setState('idle');
mic.disabled = true;       // 等健康检查确认组件就绪后再放开

// 恢复上次选的麦克风（不用每次先录一遍才改设备）
try { inputDeviceId = localStorage.getItem(MIC_KEY) || ''; } catch (e) {}
fillDevices();

requestAnimationFrame(loop);
checkHealth();
setInterval(() => { if (state === 'idle') checkHealth(); }, 8000);
window.addEventListener('resize', () => { /* 尺寸在 draw 里自适应 */ });
</script>
