<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E.V.</title>
<!-- 手机"添加到主屏幕"后就是个 App：无地址栏、独立任务卡片 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#04070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  /* ==================================================================
     E.V. — JARVIS / FRIDAY 风格全息控制台
     设计原则（上一版踩过的坑）：
       1. 球必须是绝对主角 —— 侧栏会把它挤成配角，所以只留单列
       2. 控件不藏进弹出面板 —— 常用的四个（说话/电话/打字/清空）常显
       3. 配色是「青色数据 + 琥珀标签」，不是「一片青」也不是「一片金」
       4. 不用圆角大卡片，用发丝线 + 切角 + 角标 —— HUD 靠线，不靠块
     ================================================================== */
  :root{
    --bg:#04070a;
    --bg2:#070c12;
    --ink:#cfe3f2;
    --ink-hi:#eef9ff;
    --dim:rgba(186,214,232,.62);
    --dim2:rgba(186,214,232,.38);
    --line:rgba(120,190,225,.11);
    --line2:rgba(120,190,225,.22);
    --cy:#5fd8ff;
    --cy-dim:#2ea6cf;
    --amber:#ffb347;          /* JARVIS 的金 —— 只给小标签和角标用 */
    --red:#ff5f52;
    --grn:#4fe0b0;
    --violet:#9d8cff;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,monospace;
    --sans:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  ::selection{background:rgba(95,216,255,.30);color:#fff}
  ::-moz-selection{background:rgba(95,216,255,.30);color:#fff}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}

  /* 单列三行：顶栏 / 舞台 / 控制条。没有左右栏 —— 球占满中间。
     ⚠️ grid-template-columns 必须显式写 minmax(0,1fr)：
     只写 grid-template-rows 时，隐式列是 auto，会被顶栏内容（版本号+按钮）
     撑到比视口更宽，整页向右溢出，球和底栏一起被切掉 —— 手机端就是这个症状 */
  body{
    margin:0;overflow:hidden;color:var(--ink);background:var(--bg);
    font:14px/1.65 var(--sans);
    display:grid;grid-template-rows:44px minmax(0,1fr) auto;
    grid-template-columns:minmax(0,1fr);
  }

  /* 底纹三层：极细网格（撑质感）→ 扫描线（CRT 味）→ 暗角（聚焦中心） */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(95,216,255,.032) 1px,transparent 1px),
      linear-gradient(90deg,rgba(95,216,255,.032) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 66% 62% at 50% 42%,#000 0%,transparent 76%);
            mask-image:radial-gradient(ellipse 66% 62% at 50% 42%,#000 0%,transparent 76%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse 82% 74% at 50% 40%,transparent 38%,rgba(0,0,0,.78) 100%);
  }
  body > *{position:relative;z-index:1}

  .cut{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
  .k{font:9.5px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
  .sec{
    font:9.5px/1.2 var(--mono);letter-spacing:.20em;text-transform:uppercase;
    color:var(--amber);display:flex;align-items:center;gap:9px;
  }
  .sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,179,71,.22),transparent)}

  /* ==================== 顶栏 ==================== */
  header{
    display:flex;align-items:center;gap:14px;padding:0 18px;
    border-bottom:1px solid var(--line2);position:relative;
    background:linear-gradient(180deg,rgba(8,14,20,.94),rgba(4,7,10,.25));
  }
  /* 顶栏底边：左端一道青光扫出去，HUD 的「设备在运行」暗示 */
  header::after{
    content:"";position:absolute;left:0;bottom:-1px;height:1px;right:0;
    background:linear-gradient(90deg,rgba(95,216,255,.75) 0%,rgba(95,216,255,.14) 22%,transparent 52%);
    pointer-events:none;
  }
  header h1{
    margin:0;font:600 14px/1 var(--sans);letter-spacing:.58em;color:var(--ink-hi);
    display:flex;align-items:baseline;
  }
  header h1 small{
    font:9.5px/1 var(--mono);letter-spacing:.22em;color:var(--amber);
    margin-left:13px;text-transform:uppercase;font-weight:400;opacity:.78;
  }
  /* 状态灯：方形小点，不带圆角 —— 圆形会变成「App 通知」 */
  #dot{
    width:5px;height:5px;flex:none;background:var(--dim2);
    box-shadow:0 0 0 1px rgba(120,190,225,.18);transition:background .25s;
  }
  #dot.on{background:var(--cy);animation:breathe 2.4s ease-in-out infinite;box-shadow:0 0 8px rgba(95,216,255,.65)}
  #dot.rec{background:var(--red);animation:breathe 1.1s ease-in-out infinite;box-shadow:0 0 8px rgba(255,95,82,.65)}
  #dot.think{background:var(--violet);animation:breathe .9s ease-in-out infinite;box-shadow:0 0 8px rgba(157,140,255,.65)}
  #dot.speak{background:var(--grn);animation:breathe 1.4s ease-in-out infinite;box-shadow:0 0 8px rgba(79,224,176,.65)}
  @keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
  #stateLbl{
    font:10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink);min-width:74px;
  }
  #health{
    margin-left:auto;font:10px/1.5 var(--mono);letter-spacing:.04em;color:var(--dim);
    text-align:right;text-transform:uppercase;white-space:nowrap;
  }
  #health .bad{color:var(--red)}
  #health .good{color:var(--grn)}
  #health i{color:rgba(186,214,232,.22);font-style:normal;padding:0 3px}
  #logToggle{
    height:26px;padding:0 11px;flex:none;background:transparent;
    border:1px solid var(--line2);color:var(--dim);
    font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  #logToggle:hover{border-color:rgba(95,216,255,.55);color:var(--ink-hi)}
  #logToggle[aria-pressed="true"]{border-color:rgba(95,216,255,.55);color:var(--cy);background:rgba(95,216,255,.07)}
  #unread{
    display:none;min-width:14px;height:14px;padding:0 3px;
    background:var(--amber);color:#160c00;font:700 9px/14px var(--mono);
    letter-spacing:0;text-align:center;
  }
  #unread.on{display:inline-block}
  #buildStamp{
    font:9px/1 var(--mono);letter-spacing:.08em;color:rgba(186,214,232,.3);
    cursor:pointer;user-select:none;white-space:nowrap;
  }
  #buildStamp:hover{color:var(--dim)}

  /* ==================== 舞台 ==================== */
  #stage{
    position:relative;min-height:0;min-width:0;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:0 16px 6px;
  }
  /* 中心一团极淡的青光 + 底部一条「地平线」，让球像浮在暗室里 */
  #stage::before{
    content:"";position:absolute;left:50%;top:46%;width:120vmin;height:120vmin;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle,rgba(95,216,255,.075) 0%,rgba(95,216,255,.028) 32%,transparent 62%);
  }
  #stage::after{
    content:"";position:absolute;left:50%;bottom:0;width:100%;height:34%;
    transform:translateX(-50%);pointer-events:none;
    background:linear-gradient(0deg,rgba(95,216,255,.035),transparent 70%);
  }

  /* 四角定位角标：HUD 的基本礼节。四个角，长短边不对称才像仪器 */
  .brk{position:absolute;width:26px;height:26px;pointer-events:none;z-index:3;opacity:.75}
  .brk.a{left:16px;top:14px;border-left:1px solid rgba(95,216,255,.42);border-top:1px solid rgba(95,216,255,.42)}
  .brk.b{right:16px;top:14px;border-right:1px solid rgba(95,216,255,.42);border-top:1px solid rgba(95,216,255,.42)}
  .brk.c{left:16px;bottom:14px;border-left:1px solid rgba(95,216,255,.30);border-bottom:1px solid rgba(95,216,255,.30)}
  .brk.d{right:16px;bottom:14px;border-right:1px solid rgba(95,216,255,.30);border-bottom:1px solid rgba(95,216,255,.30)}

  /* 四角遥测：不占列，只贴在舞台边缘。信息做「存在的证据」，不做面板 */
  .hud{
    position:absolute;top:16px;z-index:4;pointer-events:none;
    display:flex;flex-direction:column;gap:3px;min-width:132px;
  }
  #teleL{left:26px}
  #teleR{right:26px;text-align:right}
  .hudT{
    font:9px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;
    color:var(--amber);opacity:.62;margin-bottom:5px;
  }
  .ro{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:3px 0;border-bottom:1px solid rgba(120,190,225,.05);
  }
  #teleR .ro{flex-direction:row-reverse}
  .ro:last-child{border-bottom:none}
  .ro .v{
    font:11px/1 var(--mono);letter-spacing:.04em;color:var(--ink);
    font-variant-numeric:tabular-nums;text-align:right;
    max-width:136px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ro .v.cy{color:var(--cy)}
  .ro .v.dim{color:var(--dim2)}
  #tLevelBar{height:2px;margin:3px 0 2px;background:rgba(120,190,225,.10);position:relative;overflow:hidden}
  #tLevelBar i{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,rgba(95,216,255,.40),var(--cy));
    transition:width .07s linear;
  }

  /* 左右竖刻度尺：只是填充两侧的空白，让"中间一个球漂在真空里"变成"仪器面板围绕核心"。
     纯装饰，不承载任何信息，所以透明度压得很低 */
  .gauge{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none;
    width:1px;height:min(40%,360px);
    background-image:repeating-linear-gradient(180deg,rgba(95,216,255,.26) 0 1px,transparent 1px 10px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
            mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
  }
  .gauge::after{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(180deg,rgba(95,216,255,.50) 0 1px,transparent 1px 50px);
  }
  .gauge.gL{left:44px}
  .gauge.gR{right:44px}

  /* 球：留白吃掉剩余高度，球自己按视口算 —— 这是它当主角的前提 */
  #orbStage{
    flex:1 1 auto;min-height:0;width:100%;
    display:flex;align-items:center;justify-content:center;
    position:relative;z-index:2;padding:4px 0;
  }
  /* 关键：用 height 定尺寸 + width:auto + max-height:100%。
     这样对话变长、球区被挤压时，球会等比缩小而不是被裁掉一半 */
  #orb{
    height:min(54vh,46vw,600px);width:auto;max-height:100%;max-width:100%;
    aspect-ratio:1;cursor:pointer;display:block;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 0 46px rgba(95,216,255,.20));
  }
  #orb:focus-visible{outline:1px solid rgba(95,216,255,.5);outline-offset:12px}
  /* 球下方的三行状态（录音计时/电平/设备名）：固定高度，避免出现时把球顶上去 */
  #orbInfo{
    flex:none;display:flex;flex-direction:column;align-items:center;
    height:38px;justify-content:flex-start;position:relative;z-index:2;
  }
  #recTimer{
    height:17px;
    font:11px/1 var(--mono);letter-spacing:.14em;color:var(--red);
    text-transform:uppercase;opacity:0;transition:opacity .2s;
  }
  #recTimer.on{opacity:1}
  #meter{width:min(220px,50%);height:2px;margin-top:3px;opacity:0;transition:opacity .2s;background:rgba(255,95,82,.16)}
  #meter.on{opacity:1}
  #meterFill{height:100%;width:0;background:var(--red);transition:width .06s linear}
  #devInfo{
    height:15px;margin-top:3px;
    font:9.5px/1 var(--mono);letter-spacing:.12em;color:var(--dim2);
    text-transform:uppercase;opacity:0;transition:opacity .2s;
    max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #devInfo.on{opacity:1}

  /* 声频：紧贴球下方的一条细带，不抢戏 */
  #waveWrap{width:min(560px,86%);flex:none;margin:2px 0 6px;position:relative;z-index:2}
  #wave{width:100%;height:42px;display:block}
  #waveWrap .ruler{
    height:7px;margin-top:-1px;border-top:1px solid rgba(120,190,225,.10);
    background-image:repeating-linear-gradient(90deg,rgba(120,190,225,.16) 0 1px,transparent 1px 15px);
    opacity:.8;
  }

  /* 对话流：球下方居中窄栏。有它才像「有记忆」，不占侧栏才不像「后台系统」 */
  /* 三个约束缺一不可：
       min-height  保底一行，否则窗口偏矮时里面 flex:1 的 #log 会被压成 0，
                   表现为"只剩一条横线、消息全没了"
       max-height  上限，消息多了在里面滚动，别把球挤没
       height:auto 内容少的时候不占一大块空地
     上一版只写了 max-height，就踩了第一条。 */
  #logWrap{
    flex:none;width:min(720px,94%);
    height:auto;min-height:76px;max-height:min(30vh,232px);
    display:flex;flex-direction:column;position:relative;z-index:2;
    overflow:hidden;transition:max-height .28s cubic-bezier(.2,.7,.3,1),opacity .2s;
  }
  #logWrap .sec{margin-bottom:7px}
  body.nolog #logWrap{height:0;min-height:0;max-height:0;opacity:0;overflow:hidden;pointer-events:none}
  #log{
    flex:1;min-height:0;overflow-y:auto;padding:0 4px 4px 2px;
    display:flex;flex-direction:column;gap:8px;
    scrollbar-width:thin;scrollbar-color:rgba(120,190,225,.18) transparent;
  }
  /* 这里原来有一层 82%~100% 的渐隐遮罩，想把底部边缘"化开"。
     实际效果是把最后一行字的下半截也一起吃掉（尤其只有一行时），已删掉 */
  #log::-webkit-scrollbar{width:3px}
  #log::-webkit-scrollbar-thumb{background:rgba(120,190,225,.20)}
  /* 竖线 + 小标签。比气泡密度高，也更像录音转写稿 */
  .row{padding-left:10px;border-left:1px solid var(--line2);max-width:100%}
  .row.me{border-left-color:rgba(95,216,255,.34)}
  .row.ev{border-left-color:rgba(79,224,176,.26)}
  .row.sys{border-left-color:rgba(120,190,225,.12)}
  .who{
    font:9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim2);margin-bottom:4px;
  }
  .row.me .who{color:rgba(140,232,255,.72)}
  .row.ev .who{color:rgba(120,236,190,.72)}
  .bub{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;color:#d6e7f2}
  .row.me .bub{color:#b3cfdf}
  .bub.live::after{content:"▍";margin-left:1px;color:var(--cy);animation:blink .9s steps(1) infinite}
  .bub.cut{opacity:.55}
  .bub.cut::after{content:" ⌁ 打断";font:9px/1 var(--mono);letter-spacing:.16em;color:var(--amber)}
  @keyframes blink{50%{opacity:0}}
  .row.sys .bub{font:11px/1.6 var(--mono);letter-spacing:.02em;color:rgba(186,214,232,.80)}

  /* ==================== 控制条 ==================== */
  /* 一行：提示 + 四个常显控件 + 设置。常用的不藏，藏起来的一定是低频的 */
  footer{
    position:relative;padding:6px 18px 16px;
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  footer::before{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent 12%,rgba(95,216,255,.26) 50%,transparent 88%);
  }
  #hint{
    font:12px/1.5 var(--sans);color:var(--dim);text-align:center;
    max-width:min(720px,94%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    min-height:18px;
  }
  #dock{display:flex;align-items:center;gap:10px;position:relative;min-height:38px}

  /* 说话：主 CTA。胶囊 + 一圈状态光环，按下时有内收感 */
  /* 四个文字按钮（说话 / 电话 / 打字 / 清空）尺寸完全一致。
     宽度写死，不靠 padding 撑 —— 内边距撑出来的宽度会随字号、字距、字形变化，
     一改字体就又不齐了；写死之后只有文字本身在变。
     padding-left 补偿 letter-spacing 在末字后面留下的那点空，否则文字看着偏左。 */
  #mic,#phone,#typeToggle,#reset{
    height:36px;width:88px;flex:none;padding:0 0 0 .18em;
    border-radius:18px;cursor:pointer;transition:.16s;
    font:600 12px/1 var(--sans);letter-spacing:.18em;
    display:inline-flex;align-items:center;justify-content:center;
  }
  #mic{
    background:rgba(95,216,255,.07);
    border:1px solid rgba(95,216,255,.40);
    color:#cdeeff;
    box-shadow:0 0 18px rgba(95,216,255,.10),inset 0 0 14px rgba(95,216,255,.05);
  }
  #mic:hover:not(:disabled){
    border-color:rgba(95,216,255,.8);color:#fff;
    box-shadow:0 0 24px rgba(95,216,255,.26);
  }
  #mic:active:not(:disabled){transform:translateY(1px)}
  #mic:disabled{cursor:not-allowed;opacity:.34;box-shadow:none}
  #mic.rec{
    background:rgba(255,95,82,.12);
    border-color:rgba(255,95,82,.75);color:#ffdcd8;
    box-shadow:0 0 22px rgba(255,95,82,.30);
  }
  #mic.think{
    background:rgba(157,140,255,.10);
    border-color:rgba(157,140,255,.60);color:#e6e1ff;
    box-shadow:0 0 22px rgba(157,140,255,.24);
  }
  #mic.speak{
    background:rgba(79,224,176,.10);
    border-color:rgba(79,224,176,.60);color:#cffdec;
    box-shadow:0 0 22px rgba(79,224,176,.22);
  }

  /* 次级控件：细边胶囊。几何尺寸由上面那条统一规则给，这里只管颜色 */
  #phone,#typeToggle,#reset{
    background:transparent;border:1px solid var(--line2);color:var(--dim);
  }
  #toolsBtn{
    height:36px;width:36px;flex:none;padding:0;
    background:transparent;border:1px solid var(--line2);border-radius:18px;
    color:var(--dim);font:13px/1 var(--mono);letter-spacing:0;
    cursor:pointer;transition:.15s;
  }
  #phone:hover,#typeToggle:hover,#reset:hover,#toolsBtn:hover{
    border-color:rgba(95,216,255,.52);color:var(--ink-hi);background:rgba(95,216,255,.05);
  }
  #phone.on{
    border-color:rgba(79,224,176,.55);color:#bff8e5;background:rgba(79,224,176,.08);
    box-shadow:0 0 16px rgba(79,224,176,.16);
  }
  #typeToggle[aria-expanded="true"],#toolsBtn[aria-expanded="true"]{
    border-color:rgba(95,216,255,.55);color:var(--cy);background:rgba(95,216,255,.07);
  }

  /* 打字条：和按钮组「同一个位置两套内容」。
     点「打字」→ 按钮让位给输入框：底栏高度不变（球不会缩），也不会有浮层压住对话。
     前两版分别是"绝对定位弹出"（盖住最后一条对话）和"底栏长高"（球被挤小），都不如这个 */
  #typeRow{
    width:min(560px,94vw);display:none;gap:8px;align-items:center;
  }
  body.typing #dock > button{display:none}
  body.typing #typeRow{display:flex}
  #typeIn{
    flex:1;min-width:0;height:38px;padding:0 14px;

  /* 设置抽屉：只装低频项（设备 / 诊断），从右下角升起 */
  #tools{
    position:absolute;right:18px;bottom:calc(100% + 14px);z-index:26;
    width:min(360px,90vw);padding:12px 13px 13px;
    background:#070d13;border:1px solid rgba(120,190,225,.30);
    display:none;box-shadow:0 -16px 44px rgba(0,0,0,.78),0 0 0 1px rgba(95,216,255,.06);
  }
  #tools::before{
    content:"settings";position:absolute;left:13px;top:-1px;transform:translateY(-100%);

  #tools.on{display:block}

  .toolsRow > .k{flex:none;width:28px}
  .devRow{display:flex}
  #dev{

  }
  #devRefresh,#diagToggle{
    flex:none;background:none;border:1px solid var(--line2);color:var(--dim);

    padding:5px 9px;cursor:pointer;

  #devRefresh:hover,#diagToggle:hover{border-color:rgba(95,216,255,.45);color:var(--ink)}
  /* 三段选择器：语音引擎。低频但一旦要改就很急，所以放进设置里而不是藏起来 */
  .seg{display:flex;flex:1;border:1px solid var(--line2);min-width:0}
  .seg button{

  #diag{
    display:none;margin-top:10px;
    font:10px/1.6 var(--mono);color:rgba(186,214,232,.80);

    padding:8px 10px;white-space:pre-wrap;word-break:break-all;
    max-height:30vh;overflow:auto;

  #diag.on{display:block}

  /* ==================== 窄屏 ==================== */
  /* 手机：球吃满宽度，遥测块让位（信息在顶栏还有一份） */
  @media (max-width: 860px){
    body{grid-template-rows:42px minmax(0,1fr) auto}
    .hud,.gauge{display:none}
    #orb{height:min(58vh,82vw,420px)}
    #waveWrap{width:92%}
    #logWrap{max-height:min(26vh,190px)}

  @media (max-width: 520px){

    header h1{font-size:12px;letter-spacing:.44em}

    #orb{height:min(56vh,84vw)}

    }

  @media (prefers-reduced-motion: reduce){
    #dot.on,#dot.rec,#dot.think,#dot.speak,.bub.live::after{animation:none}
    #logWrap,#typeRow{transition:none}
  }
</style>

<body>
<header>
  <h1>E.V.<small>voice interface</small></h1>
  <span id="dot"></span>
  <span id="stateLbl">idle</span>
  <div id="health">检查组件…</div>
  <button id="logToggle" aria-pressed="false" aria-controls="log" title="显示 / 隐藏对话记录">记录<span id="unread"></span></button>
  <span id="buildStamp" title="点一下看诊断信息">__BUILD__</span>
</header>

<main id="stage">
  <span class="brk a" aria-hidden="true"></span>
  <span class="brk b" aria-hidden="true"></span>
  <span class="brk c" aria-hidden="true"></span>
  <span class="brk d" aria-hidden="true"></span>
  <span class="gauge gL" aria-hidden="true"></span>
  <span class="gauge gR" aria-hidden="true"></span>

  <!-- 遥测：贴在舞台四角，不占列 -->
  <div class="hud" id="teleL" aria-hidden="true">
    <div class="hudT">telemetry</div>
    <div class="ro"><span class="k">state</span><span class="v cy" id="tState">idle</span></div>
    <div class="ro"><span class="k">input</span><span class="v" id="tDev">—</span></div>
    <div class="ro"><span class="k">level</span><span class="v" id="tLevel">0%</span></div>
    <div id="tLevelBar"><i></i></div>
    <div class="ro"><span class="k">vad</span><span class="v" id="tVad">offline</span></div>
  </div>
  <div class="hud" id="teleR" aria-hidden="true">
    <div class="hudT">channel</div>
    <div class="ro"><span class="k">session</span><span class="v" id="tClock">00:00</span></div>
    <div class="ro"><span class="k">mode</span><span class="v" id="tMode">half-duplex</span></div>
    <div class="ro"><span class="k">stt</span><span class="v dim">whisper</span></div>
    <div class="ro"><span class="k">llm</span><span class="v dim">qwen3.5·4b</span></div>

  <div id="orbStage">

  <section id="logWrap">

</main>

<footer>
  <div id="hint">点球说话，说完再点一下发送；她说的时候点球可以打断</div>

  <div id="dock">
    <button id="mic" disabled>准备中</button>
    <button id="phone" title="电话模式：不用按键，停顿自动接话">电话</button>
    <button id="typeToggle" aria-expanded="false" title="打字输入">打字</button>
    <button id="reset" title="清空上下文">清空</button>
    <button id="toolsBtn" aria-expanded="false" aria-controls="tools" title="设置">⚙</button>

    <!-- 打字态：这一组和上面的按钮互斥显示，占同一个位置 -->
    <div id="typeRow" aria-hidden="true">
      <input id="typeIn" placeholder="打字也行，回车发送" autocomplete="off">
      <button id="typeCancel">取消</button>
    </div>

  <div id="tools" aria-hidden="true">
    <div class="toolsRow devRow">
      <span class="k">设备</span>

    </div>
    <div class="toolsRow">
      <span class="k">语音</span>
      <div class="seg" id="ttsSeg">
        <button data-mode="local" title="本地 Qwen3-TTS 克隆：是她的音色，但首句要 4~9 秒">本地音色</button>
        <button data-mode="cloud" title="edge-tts：0.3~0.5 秒出声，但不是这个音色">云端·快</button>
        <button data-mode="off" title="只出文字，不朗读">不朗读</button>
      </div>
    </div>
    <div class="toolsRow">
      <span class="k">排查</span>
      <button id="diagToggle" title="打开 / 收起运行时诊断">诊断信息</button>
    </div>
    <pre id="diag"></pre>
  </div>

<script>
'use strict';

// ==================== 元素 ====================
const mic = document.getElementById('mic');
const phoneBtn = document.getElementById('phone');
const hint = document.getElementById('hint');
const logEl = document.getElementById('log');
const logToggle = document.getElementById('logToggle');
const unreadEl = document.getElementById('unread');
const health = document.getElementById('health');
const typeIn = document.getElementById('typeIn');
const recTimer = document.getElementById('recTimer');
const orb = document.getElementById('orb');
const wave = document.getElementById('wave');
const meterEl = document.getElementById('meter');
const meterFill = document.getElementById('meterFill');
const devInfo = document.getElementById('devInfo');
const devSel = document.getElementById('dev');
const devRow = document.querySelector('.devRow');
const devRefresh = document.getElementById('devRefresh');
const diagEl = document.getElementById('diag');
const buildStamp = document.getElementById('buildStamp');
const toolsEl = document.getElementById('tools');
const toolsBtn = document.getElementById('toolsBtn');
const typeToggle = document.getElementById('typeToggle');
const typeRow = document.getElementById('typeRow');

const octx = orb.getContext('2d');
const wctx = wave.getContext('2d');

// ==================== HUD 遥测（纯展示，不参与任何逻辑）====================
const dotEl      = document.getElementById('dot');
const stateLblEl = document.getElementById('stateLbl');
const tState     = document.getElementById('tState');
const tDev       = document.getElementById('tDev');
const tLevel     = document.getElementById('tLevel');
const tLevelFill = document.querySelector('#tLevelBar i');
const tVad       = document.getElementById('tVad');
const tClock     = document.getElementById('tClock');
const tMode      = document.getElementById('tMode');
const BOOT_AT    = Date.now();
const STATE_COL  = { idle: 'var(--cy)', recording: 'var(--red)',
                     thinking: 'var(--violet)', speaking: 'var(--grn)' };

function paintTelemetry() {
  const s = state;
  dotEl.className = s === 'recording' ? 'rec'
                  : s === 'thinking'  ? 'think'
                  : s === 'speaking'  ? 'speak' : 'on';
  stateLblEl.textContent = s;
  tState.textContent = s;
  tState.style.color = STATE_COL[s] || 'var(--cy)';
  tDev.textContent = devLabel || '—';
  let pct = 0;
  try { pct = Math.round(Math.min(1, level()) * 100); } catch (e) { pct = 0; }
  tLevel.textContent = pct + '%';
  if (tLevelFill) tLevelFill.style.width = pct + '%';
  tVad.textContent  = phoneOn ? 'armed' : 'offline';
  tMode.textContent = phoneOn ? 'full-duplex' : 'half-duplex';
  const sec = Math.floor((Date.now() - BOOT_AT) / 1000);
  tClock.textContent = String(Math.floor(sec / 60)).padStart(2, '0')
                     + ':' + String(sec % 60).padStart(2, '0');
}
setInterval(paintTelemetry, 200);

// ==================== 状态 ====================
let state = 'idle';          // idle | recording | thinking | speaking
let recorder = null;
let chunks = [];
let recStart = 0;
let recTick = null;
let ripples = [];
let logOpen = false;      // 记录默认隐藏
let unread = 0;           // 隐藏期间收到的条数
let devLabel = '未知设备';
let silentSince = 0;
let silenceWarned = false;
let inputDeviceId = '';
let micTrack = null;
let diagAt = 0;

// ---- 电话模式（连续对话）----
let phoneOn = false;
let phoneStream = null;
let phoneRec = null;
let phoneChunks = [];
let phoneTurnAt = 0;
let hasSpeech = false;
let speechFrom = 0;
let silenceFrom = 0;
let bargeFrom = 0;
let micAnalyser = null;
let curAudio = null;

const hasMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function micWhy() {
  if (location.protocol === 'file:') return '页面用文件方式打开了（file://）';
  if (!window.isSecureContext) return location.host + ' 不是安全上下文（非 localhost 的 http 会被浏览器禁用麦克风）';
  if (!navigator.mediaDevices) return '浏览器不支持 MediaDevices（请用 Chrome / Edge）';
  return '';
}

// ==================== 音频分析 ====================
let audioCtx = null, analyser = null, freqBuf = null, timeBuf = null, micSrc = null;

function ensureCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function makeAnalyser() {
  const ctx = ensureCtx();
  if (!ctx) return null;
  const an = ctx.createAnalyser();
  an.fftSize = 1024;
  an.smoothingTimeConstant = 0.75;
  if (freqBuf === null || freqBuf.length !== an.frequencyBinCount) {
    freqBuf = new Uint8Array(an.frequencyBinCount);
  }
  if (timeBuf === null || timeBuf.length !== an.fftSize) {
    timeBuf = new Uint8Array(an.fftSize);
  }
  return an;
}

// 麦克风接分析器（不接 destination，避免自己听自己）
let audioGraphErr = '';
function attachMic(stream) {
  const ctx = ensureCtx();
  const an = makeAnalyser();
  if (!ctx || !an) { audioGraphErr = '浏览器不支持 AudioContext'; return false; }
  try {
    micSrc = ctx.createMediaStreamSource(stream);
    micSrc.connect(an);
    analyser = an;
    micAnalyser = an;
    audioGraphErr = '';
    return true;
  } catch (e) {
    analyser = null;
    micAnalyser = null;
    audioGraphErr = e.message || String(e);
    return false;
  }
}

// 只拆麦克风侧（电话模式会一直持有它）
function detachMic() {
  try { if (micSrc) micSrc.disconnect(); } catch (e) {}
  micSrc = null;
  micAnalyser = null;
  micTrack = null;
  if (analyser !== playAnalyser) analyser = playAnalyser;
}

// ==================== 流式播放器 ====================
// 为什么不用 <audio> 元素播：TTS 现在是"一句一段"地回来的，每段一个独立 mp3。
// 用 <audio> 逐段播，段间会有 100~300ms 的重新缓冲黑屏感；
// Web Audio 的 BufferSource 能按 ctx.currentTime **精确排期**，段与段首尾相接。
const player = { ctx: null, an: null, gain: null, srcs: [], nextAt: 0, playing: false };
let playAnalyser = null;

function playerReady() {
  const ctx = ensureCtx();
  if (!ctx) return null;
  if (!player.ctx) {
    player.ctx = ctx;
    player.an = makeAnalyser();
    player.gain = ctx.createGain();
    player.gain.connect(player.an);
    player.an.connect(ctx.destination);
    // 浏览器会把 AudioContext 挂起（自动播放策略）。挂起时 BufferSource 不走时间轴，
    // onended 永远不触发 —— 界面就会卡在"说话中"。这里兜住，别让状态机僵死。
    ctx.onstatechange = () => {
      if (ctx.state !== 'running' && player.playing) {
        stopPlayback();
        if (turn && turn.done) finishTurn(turn);
        else setHint('音频被浏览器挂起了 —— 点一下页面任意处继续');
      }
    };
  }
  if (player.ctx.state === 'suspended') { player.ctx.resume().catch(() => {}); }
  return player;
}

// 停止播放（打断 / 挂断 / 新一轮）。注意：不清 gain 节点，下一个 buffer 直接接上
function stopPlayback() {
  for (const s of player.srcs) {
    try { s.stop(); } catch (e) {}
    try { s.disconnect(); } catch (e) {}
  }
  player.srcs = [];
  player.nextAt = 0;
  player.playing = false;
  playAnalyser = null;
  analyser = micAnalyser;
  curAudio = null;
}

// 兼容旧调用点（原来拆 <audio> 用的）
function detachPlay() { stopPlayback(); }

// 兼容老调用：整条拆掉
function detach() { detachPlay(); detachMic(); }

// ==================== 流式音频入队 ====================
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// 一段音频到了：解码 -> 按时间轴排期 -> 播。返回 Promise 不阻塞 SSE 读取
let pendingAudio = 0;     // 正在解码、还没排进队列的段数（防止 done 先到误判"播完了"）

async function enqueueAudio(b64, tok) {
  const p = playerReady();
  if (!p) return;
  pendingAudio += 1;
  let buf = null;
  try {
    buf = await p.ctx.decodeAudioData(b64ToBytes(b64).buffer);
  } catch (e) {
    console.warn('音频段解码失败，跳过', e);            // 单段失败不影响后面
  } finally {
    pendingAudio -= 1;
  }
  if (buf && isToken(tok)) {
    const src = p.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(p.gain);
    // 排期：比"现在"晚一点点（防止 start 时间已过被吞），并与上一段首尾相接
    const at = Math.max(p.ctx.currentTime + 0.04, p.nextAt);
    src.start(at);
    p.nextAt = at + buf.duration + 0.01;
    p.srcs.push(src);
    p.playing = true;
    playAnalyser = p.an;
    analyser = p.an;                                  // 让球体跟着她的声音跳
    if (state !== 'speaking') setState('speaking');
    src.onended = () => {
      p.srcs = p.srcs.filter(s => s !== src);
      if (!p.srcs.length) { p.playing = false; onSpeechDrained(); }
    };
    return;
  }
  // 这一段丢了：如果这是最后一段，别让界面卡在"说话中"
  if (pendingAudio === 0 && !p.srcs.length) onSpeechDrained();
}

// 给某个 analyser 算音量
function analyserLevel(an) {
  if (!an) return 0;
  if (!timeBuf || timeBuf.length !== an.fftSize) timeBuf = new Uint8Array(an.fftSize);
  an.getByteTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) {
    const v = (timeBuf[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / timeBuf.length) * 4.5);
}

// 音量（0~1）：时域 RMS，放大后裁剪
function level() {
  if (!analyser || !timeBuf) return 0;
  analyser.getByteTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) {
    const v = (timeBuf[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / timeBuf.length) * 4.5);
}

function spectrum() {
  if (!analyser || !freqBuf) return null;
  analyser.getByteFrequencyData(freqBuf);
  return freqBuf;
}

// ==================== 颜色 ====================
const PAL = {
  // 弧反应堆的三个特征：高饱和青、白热芯、暗底衬托。低饱和会掉成「灰塑料」
  idle:      { h: 191, s: 96, l: 56 },   // 弧堆青（JARVIS 主色）
  recording: { h: 28,  s: 96, l: 58 },   // 琥珀（警示）
  thinking:  { h: 205, s: 88, l: 68 },   // 冷白蓝（思考：更亮更冷，不换色系）
  speaking:  { h: 176, s: 92, l: 54 },   // 青绿（发声）
};

// 尊重系统「减少动态效果」
const REDUCED = window.matchMedia
  ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
  : false;
function hsla(h, s, l, a) {
  return 'hsla(' + h + ',' + Math.max(0, Math.min(100, s)) + '%,'
         + Math.max(0, Math.min(100, l)) + '%,' + a + ')';
}

// ==================== 画布尺寸 ====================
function fitCanvas(cv, ctx) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return { w: 0, h: 0 };
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: w, h: h };
}

// ==================== 画球 ====================
function drawOrb(now, amp) {
  const { w, h } = fitCanvas(orb, octx);
  if (!w || !h) return;
  const cx = w / 2, cy = h / 2;
  const col = PAL[state] || PAL.idle;
  octx.clearRect(0, 0, w, h);

  const t = REDUCED ? now * 0.16 : now;          // 减少动效时几乎静止
  const base = Math.min(w, h) * 0.265;
  const breathe = 0.014 * Math.sin(t * 1.1);
  const kick = state === 'idle' ? 0 : amp * 0.12;
  const R = base * (1 + breathe + kick);
  const hot = state === 'idle' ? 0.35 : 0.55 + amp * 0.45;

  const spec = spectrum();

  // ================= 环层：只有 4 层，间距拉开 =================
  // 上一版把 5 层环全挤在 1.12R~1.66R，屏幕上一堆虚线，看起来像脏了。
  // 现在每层之间至少留 0.15R 的空隙，一眼能数清有几层 —— 这是"精密"的来源。

  // 1) 最外：刻度盘。只做刻度，不做圆周线，避免又一根实线
  const dialR = R * 1.70;
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * Math.PI * 2 - Math.PI / 2 + t * 0.035;
    const major = i % 12 === 0;
    const len = major ? R * 0.075 : R * 0.032;
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s, col.l + 14, major ? 0.62 : 0.15);
    octx.lineWidth = major ? 1.3 : 1;
    octx.moveTo(cx + Math.cos(a) * (dialR - len), cy + Math.sin(a) * (dialR - len));
    octx.lineTo(cx + Math.cos(a) * dialR, cy + Math.sin(a) * dialR);
    octx.stroke();
  }

  // 2) 轨道弧：两段长弧反向旋转，是「它在运转」的主要动感来源。
  //    必须给够线宽和长度 —— 1px + 短弧在暗底上读起来像一道划痕，不像轨道
  octx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 2; k++) {
    const dir = k ? -1 : 1;
    const a0 = dir * t * (0.18 + k * 0.10) + (k ? Math.PI * 0.85 : 0);
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s - 6, col.l + 12, 0.16 + 0.06 * Math.sin(t * 0.8 + k * 2));
    octx.lineWidth = k ? 1.6 : 2.6;
    octx.arc(cx, cy, R * 1.50, a0, a0 + 1.62);
    octx.stroke();
  }

  // 3) 虚线环：唯一一条虚线，慢速反向 —— 再多的虚线就成噪点了
  octx.save();
  octx.translate(cx, cy);
  octx.rotate(-t * 0.09);
  octx.beginPath();
  octx.setLineDash([1.5, 11]);
  octx.strokeStyle = hsla(col.h, col.s, col.l + 8, 0.30);
  octx.lineWidth = 1;
  octx.arc(0, 0, R * 1.36, 0, Math.PI * 2);
  octx.stroke();
  octx.setLineDash([]);
  octx.restore();

  // 4) 声纹环：贴着球，短而密，随声音起伏 —— 它是「活的」，别的环都是死刻度
  const SEG = 72;
  for (let i = 0; i < SEG; i++) {
    const a = (i / SEG) * Math.PI * 2 - Math.PI / 2 + t * 0.10;
    let v;
    if (spec) {
      const pos = Math.pow(i / SEG, 1.6);
      const bin = Math.min(spec.length - 1, Math.floor(pos * spec.length * 0.55));
      v = spec[bin] / 255;
    } else {
      v = 0.10 + 0.08 * Math.sin(i * 0.5 + t * 1.6);   // 无声时的巡游波
    }
    const len = R * (0.018 + v * 0.13);
    const r1 = R * 1.06;
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s, col.l + 18, 0.16 + v * 0.70);
    octx.lineWidth = 1.6;
    octx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    octx.lineTo(cx + Math.cos(a) * (r1 + len), cy + Math.sin(a) * (r1 + len));
    octx.stroke();
  }

  // 5) 轨道粒子：只在 1.20R 这一条线上，稀疏 —— 撒多了像灰
  for (let i = 0; i < 3; i++) {
    const a = t * (0.16 + i * 0.06) + i * 2.1;
    const rr = R * 1.20;
    octx.beginPath();
    octx.fillStyle = hsla(col.h, 60, 92, 0.45 + amp * 0.35);
    octx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.94, 1.2, 0, Math.PI * 2);
    octx.fill();
  }

  // 6) 波纹：从球的边缘扩散出去
  if (!REDUCED && ((state === 'recording' && amp > 0.22) ||
                   (state === 'speaking' && Math.random() < 0.18))) {
    ripples.push({ r: R * 1.05, a: state === 'recording' ? 0.22 : 0.15 });
  }
  ripples = ripples.filter(rp => rp.a > 0.012);
  for (const rp of ripples) {
    rp.r += 1.4;
    rp.a *= 0.968;
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s, col.l + 10, rp.a);
    octx.lineWidth = 1;
    octx.arc(cx, cy, rp.r, 0, Math.PI * 2);
    octx.stroke();
  }

  octx.globalCompositeOperation = 'source-over';

  // ================= 球体 =================
  // 7) 球本色：高饱和青，从白热一路压到深青。中间必须够亮，边缘必须够暗
  const bodyGrad = octx.createRadialGradient(
    cx - R * 0.12, cy - R * 0.14, 0, cx, cy, R);
  bodyGrad.addColorStop(0.00, hsla(col.h, 100, 92, 0.98));
  bodyGrad.addColorStop(0.16, hsla(col.h, 100, 80, 0.96));
  bodyGrad.addColorStop(0.38, hsla(col.h, 100, 62, 0.94));
  bodyGrad.addColorStop(0.62, hsla(col.h + 2, 98, 42, 0.92));
  bodyGrad.addColorStop(0.84, hsla(col.h + 4, 96, 26, 0.88));
  bodyGrad.addColorStop(1.00, hsla(col.h + 6, 96, 18, 0.80));
  octx.beginPath();
  octx.fillStyle = bodyGrad;
  octx.arc(cx, cy, R, 0, Math.PI * 2);
  octx.fill();

  // 7b) 边缘衰减：球体感 = 中心亮、边缘暗。
  //     上一版这道渐变起手太猛（0.55 就给 0.12 黑），画出一圈脏黑的"轮胎"；
  //     现在改成贴边才压下去，过渡全在中后段
  const limb = octx.createRadialGradient(cx, cy, R * 0.52, cx, cy, R);
  limb.addColorStop(0.00, 'rgba(0,0,0,0)');
  limb.addColorStop(0.55, hsla(col.h, 92, 4, 0.06));
  limb.addColorStop(0.85, hsla(col.h, 92, 3, 0.30));
  limb.addColorStop(1.00, hsla(col.h, 92, 2, 0.64));
  octx.beginPath();
  octx.fillStyle = limb;
  octx.arc(cx, cy, R, 0, Math.PI * 2);
  octx.fill();

  // 8) 球内结构：只留「一条赤道弧 + 一条内环 + 一道扫描线」。
  //    上一版画了 3 条经线 + 3 条纬线，远看像沙滩球/西瓜纹 —— 全删
  octx.save();
  octx.beginPath();
  octx.arc(cx, cy, R - 0.5, 0, Math.PI * 2);
  octx.clip();

  // 8a) 一条会转的赤道弧（用椭圆模拟球面，不用整颗球画网）
  octx.save();
  octx.translate(cx, cy);
  octx.rotate(-0.28);
  for (let m = 0; m < 2; m++) {
    const ry = R * (0.30 + m * 0.34);
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, 96, 86, 0.10 + m * 0.04);
    octx.lineWidth = 1;
    octx.ellipse(0, 0, R * 0.96, ry, 0, 0, Math.PI * 2);
    octx.stroke();
  }
  octx.restore();

  // 8b) 内环：虚线，慢慢转
  octx.save();
  octx.translate(cx, cy);
  octx.rotate(t * 0.30);
  octx.beginPath();
  octx.setLineDash([1.5, 7]);
  octx.strokeStyle = hsla(col.h, 95, 88, 0.18);
  octx.lineWidth = 1;
  octx.arc(0, 0, R * 0.46, 0, Math.PI * 2);
  octx.stroke();
  octx.setLineDash([]);
  octx.restore();

  // 8c) 扫描线：上下扫过球面，HUD 味的来源
  const sy = cy - R + (((t * 0.20) % 1) * 2 * R);
  const sg = octx.createLinearGradient(0, sy - 18, 0, sy + 18);
  sg.addColorStop(0, hsla(col.h, 60, 94, 0));
  sg.addColorStop(0.5, hsla(col.h, 60, 94, 0.10 + amp * 0.14));
  sg.addColorStop(1, hsla(col.h, 60, 94, 0));
  octx.fillStyle = sg;
  octx.fillRect(cx - R, sy - 18, 2 * R, 36);
  octx.restore();   // 解除球内裁剪

  // 9) 叠光：白热芯 + 外扩辉光（必须画在球色之后，否则光被颜色盖掉）
  octx.globalCompositeOperation = 'lighter';

  const coreGrad = octx.createRadialGradient(
    cx - R * 0.06, cy - R * 0.08, 0, cx - R * 0.06, cy - R * 0.08, R * 0.52);
  coreGrad.addColorStop(0.00, hsla(col.h, 16, 100, 0.46 + amp * 0.16));
  coreGrad.addColorStop(0.22, hsla(col.h, 70, 96, 0.22));
  coreGrad.addColorStop(0.60, hsla(col.h, 85, 90, 0.06));
  coreGrad.addColorStop(1.00, hsla(col.h, 85, 90, 0));
  octx.beginPath();
  octx.fillStyle = coreGrad;
  octx.arc(cx - R * 0.06, cy - R * 0.08, R * 0.52, 0, Math.PI * 2);
  octx.fill();

  const halo = octx.createRadialGradient(cx, cy, R * 0.98, cx, cy, R * 1.34);
  halo.addColorStop(0.00, hsla(col.h, 100, 62, 0.12 + amp * 0.10));
  halo.addColorStop(0.40, hsla(col.h, 100, 56, 0.035));
  halo.addColorStop(1.00, hsla(col.h, 100, 50, 0));
  octx.beginPath();
  octx.fillStyle = halo;
  octx.arc(cx, cy, R * 1.34, 0, Math.PI * 2);
  octx.fill();

  octx.globalCompositeOperation = 'source-over';

  // 10) 边缘：一道亮环。球再暗，这道环也必须是全场最锐的线
  octx.beginPath();
  octx.strokeStyle = hsla(col.h, 100, 90, 0.60 + 0.30 * hot);
  octx.lineWidth = 1.3;
  octx.arc(cx, cy, R, 0, Math.PI * 2);
  octx.stroke();

  // 11) 内环 + 辐条：反应堆的"炉心"
  const innerPulse = 0.5 + 0.5 * Math.sin(t * 1.6);
  octx.beginPath();
  octx.strokeStyle = hsla(col.h, col.s - 10, 92, 0.14 + innerPulse * 0.12);
  octx.lineWidth = 1;
  octx.arc(cx, cy, R * 0.24, 0, Math.PI * 2);
  octx.stroke();

  for (let k = 0; k < 3; k++) {
    const a = t * 0.5 + (k * Math.PI * 2) / 3;
    octx.beginPath();
    octx.strokeStyle = hsla(col.h, col.s, 90, 0.08 + amp * 0.18);
    octx.lineWidth = 1;
    octx.moveTo(cx + Math.cos(a) * R * 0.13, cy + Math.sin(a) * R * 0.13);
    octx.lineTo(cx + Math.cos(a) * R * 0.23, cy + Math.sin(a) * R * 0.23);
    octx.stroke();
  }
}

// ==================== 画声频 ====================
const BARS = 52;
const barLevels = new Float32Array(BARS);

function drawWave(now) {
  const { w, h } = fitCanvas(wave, wctx);
  if (!w || !h) return;
  const col = PAL[state] || PAL.idle;
  const data = spectrum();

  wctx.clearRect(0, 0, w, h);

  const slot = w / BARS;
  const bw = Math.max(2, slot * 0.55);

  for (let i = 0; i < BARS; i++) {
    let target;
    if (data) {
      // 对数取样：低频给更多格子，人声集中在这里
      const pos = Math.pow(i / BARS, 1.5);
      const bin = Math.min(data.length - 1, Math.floor(pos * data.length * 0.62));
      target = (data[bin] / 255) * (1 - pos * 0.35);
      if (state === 'idle') target = 0;
    } else {
      target = 0;
    }
    // idle 时给一点极轻的呼吸，表示"在线"
    const idleBreath = 0.05 + 0.035 * Math.sin(now * 1.3 + i * 0.35);
    if (state === 'idle') target = idleBreath;

    barLevels[i] += (target - barLevels[i]) * 0.35;

    const bh = Math.max(2, barLevels[i] * (h - 6));
    const x = i * slot + (slot - bw) / 2;
    const y = h - bh - 2;
    wctx.fillStyle = hsla(col.h, col.s + 6, col.l + 8, 0.28 + barLevels[i] * 0.7);
    if (wctx.roundRect) {
      wctx.beginPath();
      wctx.roundRect(x, y, bw, bh, bw / 2);
      wctx.fill();
    } else {
      wctx.fillRect(x, y, bw, bh);
    }
  }

  // 中线
  wctx.strokeStyle = hsla(col.h, col.s, col.l, 0.12);
  wctx.lineWidth = 1;
  wctx.beginPath();
  wctx.moveTo(0, h - 1.5);
  wctx.lineTo(w, h - 1.5);
  wctx.stroke();
}

// ==================== 主循环 ====================
function drawDiag(now) {
  if (!diagEl.classList.contains('on') || now - diagAt < 0.4) return;
  diagAt = now;
  const t = micTrack;
  let s = {};
  try { if (t && t.getSettings) s = t.getSettings() || {}; } catch (e) {}
  const lines = [
    'ctx       : ' + (audioCtx ? audioCtx.state : '未创建')
      + '   analyser: ' + (analyser ? 'yes' : 'no'),
    'track     : ' + (t ? (t.label || '(无标签)') : '(当前未录音)'),
    'track 状态: readyState=' + (t ? t.readyState : '-')
      + '  muted=' + (t ? t.muted : '-')
      + '  enabled=' + (t ? t.enabled : '-'),
    '采样       : ' + (s.sampleRate || '-') + ' Hz  '
      + (s.channelCount || '-') + ' ch',
    '信号       : rms=' + level().toFixed(4)
      + '  (' + (analyser ? '已接分析器' : '未接 —— 波形不可能动') + ')',
    '状态       : ' + state,
    '可用输入   : ' + devSel.options.length + ' 个',
  ];
  diagEl.textContent = lines.join('\n');
}

function loop() {
  const now = performance.now() / 1000;
  const amp = state === 'idle' ? 0 : level();

  // 录音时：电平条 + 静默告警（"说了话但采不到"最容易误判）
  if (state === 'recording') {
    meterFill.style.width = Math.min(100, amp * 150) + '%';
    if (amp > 0.02) {
      silentSince = 0;
      if (silenceWarned) silenceWarned = false;
    } else if (!silentSince) {
      silentSince = now;
    } else if (!silenceWarned && now - silentSince > 2.5) {
      silenceWarned = true;
      const susp = audioCtx && audioCtx.state !== 'running';
      setHint(susp
        ? '⚠️ 音频上下文被浏览器挂起（' + audioCtx.state + '）—— 点一下页面任意处再试'
        : '⚠️ 没收到声音（电平 0）—— 检查麦克风静音键，或换一个输入设备（当前：' + devLabel + '）');
    }
  }

  // ---- 电话模式：自动断句 + 打断 ----
  if (phoneOn) {
    if (state === 'recording') {
      const a = analyserLevel(micAnalyser);
      if (a > VAD_SPEECH) {
        if (!speechFrom) speechFrom = now;
        hasSpeech = true;
        silenceFrom = 0;
      } else if (hasSpeech) {
        if (!silenceFrom) silenceFrom = now;
        else if (now - silenceFrom > VAD_SILENCE) {
          // 只说了"咳"一声这种极短的，判为噪声，继续听，不发送
          if (now - speechFrom >= MIN_SPEECH) endPhoneTurn();
          else { hasSpeech = false; speechFrom = 0; silenceFrom = 0; }
        }
      }
      if (hasSpeech && now - phoneTurnAt > VAD_MAX_TURN) endPhoneTurn();
      // 一直没人说话：定期重开一段，避免录出一个巨大的空文件
      if (!hasSpeech && now - phoneTurnAt > 40) endPhoneTurn();
    } else if (state === 'speaking') {
      // 她说话时：你开口就可以打断（单向，只允许你打断她）
      const m = analyserLevel(micAnalyser);
      if (m > BARGE_LEVEL) {
        if (!bargeFrom) bargeFrom = now;
        else if (now - bargeFrom > BARGE_HOLD) { interruptHer(); }
      } else {
        bargeFrom = 0;
      }
    }
  }

  drawOrb(now, amp);
  drawWave(now);
  drawDiag(now);
  requestAnimationFrame(loop);
}

// ==================== 界面状态 ====================
// 说明：真流式之后 thinking / speaking 也允许点 —— 那一下不是"禁止说话"，
// 而是"打断她"。对讲机感就是从这里消失的。
const LABEL = { idle: '说话', recording: '发送', thinking: '打断', speaking: '打断' };
let micBlocked = false;          // 组件没就绪（whisper 没加载 / 模型服务连不上）

function setState(s) {
  state = s;
  mic.className = (s === 'recording') ? 'rec'
                : (s === 'thinking') ? 'think'
                : (s === 'speaking') ? 'speak' : '';
  mic.textContent = phoneOn ? '通话中' : LABEL[s];
  // recording 必须可点（那一下 = 发送）；thinking/speaking 也可点（那一下 = 打断）
  mic.disabled = !hasMic || phoneOn || micBlocked;
  orb.style.cursor = mic.disabled ? 'default' : 'pointer';

  if (s === 'recording') {
    recStart = Date.now();
    silentSince = 0;
    silenceWarned = false;
    clearInterval(recTick);
    recTick = setInterval(() => {
      const t = Math.floor((Date.now() - recStart) / 1000);
      const pct = Math.round(Math.min(1, level()) * 100);
      recTimer.textContent = '● 录音 ' + String(Math.floor(t / 60)) + ':' + String(t % 60).padStart(2, '0')
                           + (analyser ? '　电平 ' + pct + '%' : '　(无波形)');
    }, 200);
    recTimer.classList.add('on');
    meterEl.classList.add('on');
    devInfo.classList.add('on');
  } else {
    clearInterval(recTick);
    recTimer.classList.remove('on');
    recTimer.textContent = '';
    meterEl.classList.remove('on');
    meterFill.style.width = '0%';
    if (s !== 'idle') { /* 保留设备名，方便排查 */ } else { devInfo.classList.remove('on'); }
  }
}

function addRow(who, text, cls, live, before) {
  const row = document.createElement('div');
  row.className = 'row ' + cls;
  if (who) {
    const w = document.createElement('div');
    w.className = 'who'; w.textContent = who;
    row.appendChild(w);
  }
  const b = document.createElement('div');
  b.className = 'bub' + (live ? ' live' : '');    // live = 正在流式输出（尾巴有光标）
  b.textContent = text;
  row.appendChild(b);
  // before：插到某一行前面。assistant 气泡是先建好的（流式要用），
  // 用户那行后到，必须插到它前面，否则对话顺序会变成「答在上、问在下」。
  if (before && before.parentNode === logEl) logEl.insertBefore(row, before);
  else logEl.appendChild(row);
  // 滚到底要滚两次：同步这一次用的是插入前的高度，下一帧才是最终高度。
  // 只写同步那一行时，最后一条消息会卡在可视区外面 —— 表现为"新消息看不见"
  logEl.scrollTop = logEl.scrollHeight;
  requestAnimationFrame(() => { logEl.scrollTop = logEl.scrollHeight; });
  // 记录隐藏时，非系统消息计入未读角标
  if (!logOpen && cls !== 'sys') {
    unread += 1;
    renderUnread();
  }
  return b;
}
function setHint(t) { hint.textContent = t; }

// ==================== 健康检查 ====================
// ==================== 语音引擎切换 ====================
// 为什么要给这个开关：本地克隆音色在 4060Ti 上实测 RTF≈4（19 个字要 9 秒），
// 而打字时文字 0.9 秒就出来了 —— 声音晚 8 秒反而是干扰。
// 三个选项对应三种取舍，让用户自己挑，比替用户猜好。
const ttsSeg = document.getElementById('ttsSeg');
let ttsHasLocal = false;

function paintTtsMode(mode, hasLocal) {
  if (typeof hasLocal === 'boolean') ttsHasLocal = hasLocal;
  ttsSeg.querySelectorAll('button').forEach(b => {
    const m = b.dataset.mode;
    b.classList.toggle('on', m === mode);
    b.disabled = (m === 'local' && !ttsHasLocal);
  });
}

ttsSeg.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || b.disabled || b.classList.contains('on')) return;
  const mode = b.dataset.mode;
  try {
    const r = await fetch('/api/tts_mode', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode })
    });
    const d = await r.json();
    if (!d.ok) { setHint('切换失败：' + (d.error || '未知原因')); return; }
    paintTtsMode(d.mode, ttsHasLocal);
    setHint(mode === 'off'  ? '已关闭朗读 —— 只出文字'
          : mode === 'cloud' ? '已切到云端语音：出声快，但不是她的音色'
          : '已用本地音色：首句要等 4~9 秒（4060Ti 上 RTF≈4）');
  } catch (err) {
    setHint('切换失败：' + err.message);
  }
});

async function checkHealth() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const line = (label, o) =>
      '<span class="' + (o.ok ? 'good' : 'bad') + '">' + label + ' ' + (o.ok ? 'OK' : '×') + '</span>';
    // 顶栏只放三个灯。原来第二行还挂了 base URL（http://127.0.0.1:8090/v1），
    // 一条长串贴在右上角既不好看也没用 —— 挪进 diag 面板，想看按版本号
    health.innerHTML = [line('STT', d.stt), line('LLM', d.llm), line('TTS', d.tts)].join(' <i>/</i> ');
    health.title = 'LLM base: ' + (d.llm.base || '?');

    paintTtsMode(d.tts && d.tts.mode, d.tts && d.tts.has_local);

    const allOk = d.stt.ok && d.llm.ok;
    if (allOk) {
      micBlocked = false;
      if (state === 'idle') {
        setState('idle');
        setHint(hasMic ? '点球说话（说完再点一下发送）；她在说时点球可以打断'
                       : '麦克风不可用（' + micWhy() + '）—— 打字也能聊');
      }
    } else if (d.stt.loading) {
      micBlocked = true; mic.disabled = true; mic.textContent = '加载中';
      if (state === 'idle') setHint('语音识别模型正在载入（首次约 10~20 秒）…… 也可以先打字');
    } else {
      micBlocked = true; mic.disabled = true; mic.textContent = '不可用';
      if (state === 'idle') {
        setHint('组件没就绪：'
          + (!d.stt.ok ? '语音识别未加载（' + (d.stt.msg || '') + '）' : '')
          + (!d.llm.ok ? '模型服务连不上' : '') + ' —— 打字仍然可用');
      }
    }
  } catch (e) {
    health.innerHTML = '<span class="bad">后端连不上</span>';
    micBlocked = true; mic.disabled = true; mic.textContent = '离线';
    setHint('后端没起来？确认 run_app.sh 正在运行');
  }
}

// ==================== 输入设备 ====================
const MIC_KEY = 'ev.micId';           // 记住上次选的麦克风，下次打开不用再挑

async function fillDevices() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  try {
    const list = await navigator.mediaDevices.enumerateDevices();
    const ins = list.filter(d => d.kind === 'audioinput');
    if (!ins.length) return;
    const cur = inputDeviceId || devSel.value;
    devSel.innerHTML = '';
    ins.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      // 没授权时 label 是空的，只能靠序号区分；点「刷新」授权后就显示真名
      o.textContent = (i + 1) + '. ' + (d.label || '麦克风（未授权，点「刷新」显示名称）');
      devSel.appendChild(o);
    });
    if (cur && ins.some(d => d.deviceId === cur)) devSel.value = cur;
    else if (!cur) inputDeviceId = devSel.value;
    // 注意：未授权时 Chrome 会隐藏 deviceId，这时 cur 匹配不上 ——
    // 但**不要清掉记忆的 ID**，否则每次打开都要重选
    devRow.classList.add('on');
  } catch (e) { /* 没权限时拿不到 label，忽略 */ }
}

function rememberDevice() {
  inputDeviceId = devSel.value;
  try { localStorage.setItem(MIC_KEY, inputDeviceId); } catch (e) {}
}

devSel.onchange = () => {
  rememberDevice();
  const name = devSel.options[devSel.selectedIndex].textContent;
  setHint('已切换到「' + name + '」—— 下次录音生效（已记住）');
};

// 授权一次，把设备真实名称刷出来（Chrome 只有授权后才给 label）
devRefresh.onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch (e) { setHint('授权失败：' + e.message); return; }
  await fillDevices();
  const sel = devSel.options[devSel.selectedIndex];
  setHint('设备列表已更新，当前：' + (sel ? sel.textContent : ''));
};

// 统一的麦克风约束 + 打开逻辑（记住的设备失效时自动退回默认）
function micConstraints() {
  return Object.assign(
    { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    inputDeviceId ? { deviceId: { exact: inputDeviceId } } : {}
  );
}
async function openMic() {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
  } catch (e) {
    if (e.name === 'OverconstrainedError' && inputDeviceId) {
      inputDeviceId = '';
      try { localStorage.removeItem(MIC_KEY); } catch (err) {}
      return await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
    }
    throw e;
  }
}
// 把"实际用到的设备"记下来，下次自动用同一个
function adoptDevice(track) {
  const s = (track && track.getSettings) ? track.getSettings() : {};
  if (!s.deviceId) return;
  inputDeviceId = s.deviceId;
  try { localStorage.setItem(MIC_KEY, s.deviceId); } catch (e) {}
  devSel.value = s.deviceId;
}

// ==================== 录音 ====================
async function startRec() {
  if (!hasMic) { setHint('麦克风不可用：' + micWhy()); return; }

  // ⚠️ 必须在"用户点按钮"这个手势里同步创建 AudioContext。
  // 如果等 getUserMedia 的 await 之后再建，浏览器认为手势已过期，
  // ctx 会停在 suspended，AnalyserNode 读出来全是 0 —— 表现就是"录音中但毫无反应"。
  const ctx = ensureCtx();
  if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }

  try {
    const stream = await openMic();
    const graphOk = attachMic(stream);
    const track = stream.getAudioTracks()[0];
    micTrack = track;
    adoptDevice(track);
    devLabel = track ? (track.label || '未知设备') : '无音频轨';
    devInfo.textContent = '输入设备：' + devLabel;
    fillDevices();

    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : '';
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      detachMic();
      sendAudio(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
    };
    recorder.start();
    setState('recording');
    setHint(graphOk
      ? '正在录音…… 说完点「发送」（球和声频在动就说明收到了）'
      : '正在录音，但音频分析不可用（' + audioGraphErr + '）—— 先发出去看识别结果');
  } catch (e) {
    setState('idle');
    setHint('拿不到麦克风：' + e.message + '　（'
      + (micWhy() || '检查系统麦克风权限：Windows 设置 → 隐私 → 麦克风') + '）');
  }
}
function stopRec() {
  if (recorder && recorder.state === 'recording') recorder.stop();
}

// ==================== 电话模式（连续对话） ====================
// 原理：麦克风一直开着 -> 录音分段 -> 检测到"说过话 + 停顿 0.75s"就自动发送
//      -> 她说完自动重新开始收音；说话期间检测到你的声音就打断她（barge-in）

// 手机和 PC 的声学环境完全不同：扬声器和麦克风贴在一起（回声直接进麦克风）、
// 系统 AGC 还会把底噪一起抬起来。同一套阈值在手机上只会表现为两种故障：
//   「她还没说完就被自己的回声打断」和「你还没说完就被切成发送」。
// 所以按设备走两套预设 —— 这不是调优，是同一个算法在两个声学环境下必须的标定。
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
               || !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
// 想手动覆盖：地址后加 ?gain=mobile / ?gain=pc（排查时很有用）
const _gain = (new URLSearchParams(location.search).get('gain') || '').toLowerCase();
const MOBILE_PRESET = _gain ? (_gain === 'mobile' || _gain === '手机') : IS_MOBILE;

const VAD_SPEECH = MOBILE_PRESET ? 0.10 : 0.055;  // 判定"在说话"的音量阈值
const VAD_SILENCE = MOBILE_PRESET ? 1.2 : 1.4;    // 停顿多久才认为你说完
const MIN_SPEECH = MOBILE_PRESET ? 0.40 : 0.35;   // 至少说这么久才算一句（挡咳嗽/碰麦）
const VAD_MAX_TURN = 20;                          // 单轮最长(秒)
const BARGE_LEVEL = MOBILE_PRESET ? 0.24 : 0.12;  // 打断阈值（回声大时必须抬高）
const BARGE_HOLD = MOBILE_PRESET ? 0.40 : 0.25;   // 持续多久算真的打断
const POST_PLAY_GUARD = MOBILE_PRESET ? 520 : 260; // 她说完到重新收音的间隔(ms)，防尾音

async function startPhone() {
  if (!hasMic) { setHint('麦克风不可用：' + micWhy()); return; }
  ensureCtx();
  try {
    phoneStream = await openMic();
  } catch (e) {
    setHint('打不开麦克风：' + e.message);
    return;
  }
  attachMic(phoneStream);
  const track = phoneStream.getAudioTracks()[0];
  micTrack = track;
  adoptDevice(track);
  devLabel = track ? (track.label || '未知设备') : '无音频轨';
  devInfo.textContent = '输入设备：' + devLabel
    + '　·　' + (MOBILE_PRESET ? '手机预设（回声阈值已抬高）' : 'PC 预设');
  devInfo.classList.add('on');
  fillDevices();

  phoneOn = true;
  phoneBtn.classList.add('on');
  phoneBtn.textContent = '挂断';
  mic.disabled = true;
  beginPhoneTurn();
}

function beginPhoneTurn() {
  if (!phoneOn || !phoneStream) return;
  hasSpeech = false;
  speechFrom = 0;
  silenceFrom = 0;
  bargeFrom = 0;
  phoneChunks = [];

  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : '';
  try {
    phoneRec = new MediaRecorder(phoneStream, mime ? { mimeType: mime } : undefined);
  } catch (e) {
    setHint('录音器启动失败：' + e.message);
    return;
  }
  phoneRec.ondataavailable = e => { if (e.data.size) phoneChunks.push(e.data); };
  phoneRec.onstop = () => {
    const blob = new Blob(phoneChunks, { type: phoneRec.mimeType || 'audio/webm' });
    if (!phoneOn) { setState('idle'); return; }
    if (blob.size < 3000) { beginPhoneTurn(); return; }   // 太短，当噪声，重来
    sendAudio(blob);
  };
  phoneRec.start();
  phoneTurnAt = performance.now() / 1000;
  setState('recording');
  setHint('在听…… 慢慢说（她不会抢话）；她说话时你可随时插话');
}

function endPhoneTurn() {
  if (phoneRec && phoneRec.state === 'recording') phoneRec.stop();
}

// 重新开始收音（带一点延迟，避免她播放的尾音/回声被当成你说的话）
function resumeListening(delay) {
  if (!phoneOn) return;
  setTimeout(() => { if (phoneOn) beginPhoneTurn(); },
             delay == null ? POST_PLAY_GUARD : delay);
}

// 打断她：停播 + 掐掉还没合完的 TTS + 立刻回到收音（流式之后这是常态操作）
function interruptHer() {
  abortTurn();
  bargeFrom = 0;
  if (phoneOn) beginPhoneTurn();
  else setState('idle');
}

function stopPhone() {
  phoneOn = false;
  phoneBtn.classList.remove('on');
  phoneBtn.textContent = '电话';
  abortTurn();
  try { if (phoneRec && phoneRec.state === 'recording') phoneRec.stop(); } catch (e) {}
  if (phoneStream) {
    phoneStream.getTracks().forEach(t => t.stop());
    phoneStream = null;
  }
  detach();
  setState('idle');
  setHint('已挂断');
}

phoneBtn.onclick = () => { phoneOn ? stopPhone() : startPhone(); };

// ==================== 一轮对话（SSE 流式） ====================
// 服务端事件: meta(识别结果) / delta(增量文字) / audio(一段 mp3) / done / error
// 前端只做三件事：把文字拼进气泡、把音频排进播放队列、根据状态更新 UI。

let streamToken = 0;        // 每轮 +1：旧请求的回调看到这个变了就自我失效
let activeCtrl = null;      // 当前这轮的 AbortController（打断就是 abort 它）
let turn = null;            // { token, reply, done, timing }

function isToken(tok) { return !!turn && turn.token === tok; }

function newTurn() {
  streamToken += 1;
  turn = { token: streamToken, reply: '', done: false, timing: null, finished: false };
  return turn;
}

// SSE 读取器：fetch + ReadableStream 手搓，因为 EventSource 不能 POST 音频
async function streamTurn(url, body, hintText) {
  const t = newTurn();
  if (activeCtrl) { try { activeCtrl.abort(); } catch (e) {} }
  const ctrl = new AbortController();
  activeCtrl = ctrl;
  stopPlayback();

  setState('thinking');
  setHint(hintText || '思考中……');
  const bubble = addRow('E.V.', '', 'ev', true);
  t.bubble = bubble;          // 记在本轮上：被打断时要能把它收拾干净

  try {
    const isForm = (typeof FormData !== 'undefined') && (body instanceof FormData);
    const res = await fetch(url, {
      method: 'POST', body: body, signal: ctrl.signal,
      headers: isForm ? undefined : { 'Content-Type': 'application/json' },
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl);
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        let ev;
        try { ev = JSON.parse(payload); } catch (e) { continue; }
        if (!isToken(t.token)) return;
        onEvent(t, ev, bubble);
      }
    }
    // 连接正常结束但没收到 done（后端异常断流）
    if (isToken(t.token) && !t.done && !t.finished) {
      t.done = true;
      if (!player.srcs.length) finishTurn(t);
    }
  } catch (e) {
    if (!isToken(t.token)) return;                    // 被打断引起的 abort，不算错误
    if (bubble.parentNode) bubble.parentNode.remove();
    setState('idle');
    setHint('请求失败：' + e.message + '（serve_hf.py 起了吗？）');
    if (phoneOn) resumeListening(800);
  }
}

function onEvent(t, ev, bubble) {
  if (ev.t === 'meta') {
    // 插到 E.V. 那行前面：问句必须在答句上方（自上而下）
    if (ev.user_text) addRow('你', ev.user_text, 'me', false, bubble.parentElement);
    setHint('在想……');
  } else if (ev.t === 'delta') {
    t.reply += ev.d;
    bubble.textContent = t.reply;
    if (logOpen) logEl.scrollTop = logEl.scrollHeight;
  } else if (ev.t === 'audio') {
    enqueueAudio(ev.b64, t.token);                    // 不 await：边播边收下一段
  } else if (ev.t === 'done') {
    if (ev.reply) { t.reply = ev.reply; bubble.textContent = t.reply; }
    bubble.classList.remove('live');
    t.done = true;
    t.timing = ev.timing || {};
    if (ev.tts_error) t.ttsErr = ev.tts_error;
    if (!player.srcs.length && !pendingAudio) finishTurn(t);  // 极端情况：TTS 全失败
  } else if (ev.t === 'error') {
    bubble.classList.remove('live');
    setState('idle');
    setHint(ev.msg || '出错了');
    t.finished = true;
    if (phoneOn) resumeListening(600);
  }
}

// 最后一段音频播完（或没音频可播）时收尾
function onSpeechDrained() {
  if (!turn || !turn.done) return;                    // token 还在来，先别收尾
  if (pendingAudio > 0) return;                       // 还有段没解完码
  finishTurn(turn);
}

function finishTurn(t) {
  if (!isToken(t.token) || t.finished) return;
  t.finished = true;
  const tm = t.timing || {};
  const cost = tm.first_audio
    ? '（首声 ' + tm.first_audio + 's / 总 ' + tm.total + 's）' : '';
  if (phoneOn) { resumeListening(); return; }         // 电话模式：接着说
  setState('idle');
  setHint(t.ttsErr
    ? '语音合成失败，这条只有文字'
    : '可以继续说了　' + cost + '　嫌点着麻烦就开「电话」');
}

function sendAudio(blob) {
  const fd = new FormData();
  fd.append('audio', blob, 'voice.webm');
  streamTurn('/api/stream/turn', fd, '识别中……');
}

function sendText(text) {
  text = (text || '').trim();
  if (!text) return;
  if (phoneOn) { setHint('电话模式下直接说话就行（想打字先点「挂断」）'); return; }
  ensureCtx();                                        // 在按键手势里唤醒音频上下文
  if (state !== 'idle') abortTurn();                  // 正在说/正在想：直接打断再问
  streamTurn('/api/stream/text', JSON.stringify({ text: text }), '思考中……');
}

// 打断：停播 + abort 请求（后端 generator 被取消 -> 模型停止生成）+ 作废本轮令牌
function abortTurn() {
  if (activeCtrl) { try { activeCtrl.abort(); } catch (e) {} activeCtrl = null; }
  stopPlayback();
  // 收尾被打断那一轮的行：一个字都没说出来就删掉，说了半句就留着标「被打断」
  const b = turn && turn.bubble;
  if (b && b.parentElement) {
    if (!b.textContent.trim()) b.parentElement.remove();
    else { b.classList.remove('live'); b.classList.add('cut'); }
  }
  turn = null;
  streamToken += 1;
}

// ==================== 记录面板（默认隐藏） ====================
function renderUnread() {
  if (unread > 0) {
    unreadEl.textContent = unread > 9 ? '9+' : String(unread);
    unreadEl.classList.add('on');
  } else {
    unreadEl.classList.remove('on');
  }
}

function setLogOpen(open) {
  logOpen = open;
  logEl.classList.toggle('show', open);
  logEl.setAttribute('aria-hidden', String(!open));
  logToggle.setAttribute('aria-pressed', String(open));
  // 宽屏时记录是右侧常驻面板，靠 body.nolog 收起整列
  document.body.classList.toggle('nolog', !open);
  if (open) {
    unread = 0;
    renderUnread();
    logEl.scrollTop = logEl.scrollHeight;
  }
}

logToggle.onclick = () => setLogOpen(!logOpen);

// 设置抽屉：只装低频项（设备 / 诊断）。常用控件（说话/电话/打字/清空）常驻底栏，不藏。
// 和打字条互斥 —— 两个浮层同时开着会重叠，这是上一版最容易犯的错。
function setToolsOpen(open) {
  toolsEl.classList.toggle('on', open);
  toolsEl.setAttribute('aria-hidden', String(!open));
  toolsBtn.setAttribute('aria-expanded', String(open));
  if (open) setTypeOpen(false);
}
toolsBtn.onclick = () => setToolsOpen(!toolsEl.classList.contains('on'));

// 打字态：按钮组 ↔ 输入框，同一个位置互相顶替（body.typing 控制）
function setTypeOpen(open) {
  document.body.classList.toggle('typing', open);
  typeRow.setAttribute('aria-hidden', String(!open));
  typeToggle.setAttribute('aria-expanded', String(open));
  if (open) {
    setToolsOpen(false);
    // 等一帧再 focus，否则 iOS 上键盘弹出会把布局顶歪
    setTimeout(() => { try { typeIn.focus(); } catch (e) {} }, 30);
  } else {
    typeIn.blur();
  }
}
typeToggle.onclick = () => setTypeOpen(!document.body.classList.contains('typing'));
document.getElementById('typeCancel').onclick = () => setTypeOpen(false);

// ==================== 事件 ====================
function onTap() {
  if (phoneOn) return;
  if (state === 'idle') startRec();
  else if (state === 'recording') stopRec();
  else { abortTurn(); startRec(); }        // 她在说 / 在想：这一下 = 打断 + 我要说
}
mic.onclick = onTap;
orb.onclick = onTap;

document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', { method: 'POST' });
  logEl.innerHTML = '';
  addRow('', '已清空上下文', 'sys');
};

typeIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) {
    sendText(typeIn.value); typeIn.value = '';
    if (!phoneOn) setTypeOpen(false);      // 发完就收，别让输入行一直悬着挡球
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // 分层关闭：先收浮层，再收记录 —— 一次 Esc 只退一层，符合直觉
  if (document.body.classList.contains('typing')) { setTypeOpen(false); return; }
  if (toolsEl.classList.contains('on')) { setToolsOpen(false); return; }
  if (logOpen) setLogOpen(false);
});

// 球体本身可聚焦，键盘也能开始/结束说话
orb.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    onTap();
  }
});

// 任何一次点击都尝试唤醒被挂起的 AudioContext（浏览器自动播放策略）
document.addEventListener('pointerdown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, true);

buildStamp.onclick = () => diagEl.classList.toggle('on');
document.getElementById('diagToggle').onclick = () => diagEl.classList.toggle('on');

if (!hasMic) {
  mic.textContent = '无麦克风';
  mic.disabled = true;
  addRow('', '麦克风不可用：' + micWhy() + '　已切换为键盘输入模式（回复照常朗读）。', 'sys');
}

addRow('', '点中间的球开始说话。她话不多，别指望长篇大论。'
  + (MOBILE_PRESET ? '　[手机预设：回声阈值已抬高]' : ''), 'sys');
setState('idle');
micBlocked = true;         // 等健康检查确认组件就绪后再放开
mic.disabled = true;

// 恢复上次选的麦克风（不用每次先录一遍才改设备）
try { inputDeviceId = localStorage.getItem(MIC_KEY) || ''; } catch (e) {}
fillDevices();

requestAnimationFrame(loop);
checkHealth();
setInterval(() => { if (state === 'idle') checkHealth(); }, 8000);
// 对话记录默认展开。
// 旧逻辑是「宽屏常显、窄屏收起」—— 那时记录是右侧浮层，手机上会盖住球。
// 现在它是球下面的一条内联区域，手机上藏掉就等于看不见她说什么。
// 想清空视野自己点「记录」收起来即可。
setLogOpen(true);
window.addEventListener('resize', () => { /* 尺寸在 draw 里自适应 */ paintTelemetry(); });
</script>


</body>
</html>
